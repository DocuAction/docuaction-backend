# Pre-commit configuration — DocuAction AI backend
# Copyright © 2024–2026 Alliance Global Tech, Inc. All rights reserved.
#
# Install:  pip install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files
#
# detect-secrets requires a baseline. Generate it once with:
#   detect-secrets scan > .secrets.baseline

minimum_pre_commit_version: "3.5.0"
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (lint --fix)
        args: ["--fix"]
      - id: ruff-format
        name: ruff (format)

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: '(?x)^(\.secrets\.baseline|package-lock\.json|poetry\.lock)$'
