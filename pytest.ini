[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
asyncio_mode = auto

# NOTE: this file, not the [tool.pytest.ini_options] block in pyproject.toml, is
# what pytest actually reads — an ini file at the rootdir takes precedence and
# pyproject is ignored entirely. The two must be kept in step by hand; markers
# registered only in pyproject would not exist at runtime.
markers =
    regression: regression tests that must pass on every deploy
    qa_defect: tests for confirmed QA defects (August 2026 report)
    security: security-specific regression tests
    bulletin: bulletin module regression tests

# Unregistered markers are an error rather than a warning: a typo in a marker
# name silently selects nothing, and "0 tests, 0 failures" reads as a pass in a
# deploy gate. This is the whole reason the markers above are worth declaring.
addopts = -ra --strict-markers
