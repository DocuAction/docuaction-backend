name: DEV Release (automated)

# The single automatic path from a merge into main to a running, verified
# Azure DEV backend. Before this existed, that path was four separate manual
# steps: dispatch container-release.yml, read its run summary, copy the image
# tag into deploy-backend.yml's dispatch form, choose run_migrations by eye
# after comparing two printed revision strings. Every one of those workflows
# is untouched in what it actually DOES - this only chains their existing,
# separately-tested behaviour together and reads their outputs as data
# instead of asking a human to retype them.
#
# What this workflow does NOT do:
#   - it never selects environment: production anywhere below, so it cannot
#     reach deploy-prod no matter what happens upstream (see deploy.yml's own
#     `if`, which deploy-prod also gates on `needs.deploy-dev` - unreachable
#     from a workflow_call graph that only ever runs deploy-dev);
#   - it never writes to rce_source_records, rce_curated_records or any other
#     Government-data table - the two gov-integrity jobs below are SELECT-only;
#   - it never changes what identity anything authenticates as - every Azure
#     login below is the same `vars.AZURE_CLIENT_ID` / OIDC federated identity
#     already established on main, unchanged.
#
# The `development` GitHub Environment's required-reviewer rule still applies
# to every job below that declares `environment: development` (build's push
# step, the migration preflight, and the deploy step itself) - this workflow
# does not touch that protection rule and cannot bypass it. See the release
# pipeline report for the exact, separate change that would reduce that to a
# single approval per release instead of three.
#
# CONTROLLED MIGRATION GATE (Option D, deliberately - not a placeholder)
# DEV Postgres's firewall trusts only the docuaction-dev App Service's own
# outbound IPs (confirmed identical to the actual firewall rule set), and
# widening it to admit GitHub-hosted runners is exactly the kind of network
# weakening this pipeline must never do on its own. So migration-check almost
# always reports readable=false, and migration-gate treats that the same way
# it treats a confirmed revision mismatch: STOP, not "assume it's fine" -
# unless the operator has independently verified DEV out-of-band and passed
# migration_confirmed_current=true on a manual dispatch. This is the release
# architecture's normal, expected shape today, not a bug to work around.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'alembic/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/container-release.yml'
      - '.github/workflows/deploy-backend.yml'
      - '.github/workflows/migration-preflight.yml'
      - '.github/workflows/dev-release.yml'
  workflow_dispatch:
    inputs:
      migration_confirmed_current:
        description: 'Set true ONLY after independently verifying, via an authorized out-of-band connection, that DEV is already at the target Alembic head. This does not run or trigger a migration - it tells the gate "a human already checked", nothing more. DEV Postgres is deliberately unreachable from GitHub-hosted runners, so this input exists because the pipeline cannot verify that fact itself.'
        required: false
        type: boolean
        default: false

# One DEV release in flight at a time. Queued, not cancelled: killing a run
# mid-deploy could leave Azure pointed at a half-applied migration or an
# image swap with no completed health check, which is worse than a merge
# waiting a few minutes for the release ahead of it to finish.
concurrency:
  group: dev-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  PGHOST: docuaction-db-dev.postgres.database.azure.com
  PGDATABASE: postgres
  PG_PRINCIPAL: github-actions-docuaction-backend-dev
  DEV_APP: docuaction-dev

jobs:
  build:
    name: Build immutable image
    uses: ./.github/workflows/container-release.yml
    with:
      ref: ${{ github.sha }}
      push: true
    permissions:
      contents: read
      id-token: write

  migration-check:
    name: Read DEV's current migration state (read-only)
    uses: ./.github/workflows/migration-preflight.yml
    permissions:
      contents: read
      id-token: write

  gov-baseline:
    name: Capture Government-data baseline (read-only, before deploy)
    needs: [build, migration-check]
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    outputs:
      baseline_json: ${{ steps.snapshot.outputs.baseline_json }}
      intake_count: ${{ steps.snapshot.outputs.intake_count }}
    steps:
      - name: Login to Azure (OIDC - no stored client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Snapshot a per-delivery digest of every existing source record
        id: snapshot
        run: |
          python -m pip install --quiet psycopg2-binary
          PGTOKEN=$(az account get-access-token --resource https://ossrdbms-aad.database.windows.net --query accessToken -o tsv)
          test -n "$PGTOKEN" || { echo "FAIL: no PostgreSQL access token"; exit 1; }
          PGTOKEN="$PGTOKEN" python "$GITHUB_WORKSPACE/.github/scripts/gov_integrity_snapshot.py" >> "$GITHUB_OUTPUT"

  migration-gate:
    name: Controlled migration gate
    # Decides ONE thing: is it safe to deploy this candidate's code against
    # DEV's current schema right now. DEV Postgres is deliberately unreachable
    # from this runner (its firewall trusts only the docuaction-dev App
    # Service's own outbound IPs - confirmed identical to the firewall rule
    # set), so migration-check.outputs.readable is "false" on every ordinary
    # run today. That is not treated as "assume it's fine" - it is treated
    # exactly like "a migration is needed": deploy does not proceed without
    # either an automated readable+current result, or a human's explicit
    # migration_confirmed_current dispatch input asserting they checked
    # out-of-band. Never silently deploys against an unverified schema.
    needs: migration-check
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      run_migrations: ${{ steps.decide.outputs.run_migrations }}
    steps:
      - name: Decide whether this release may proceed
        id: decide
        env:
          READABLE: ${{ needs.migration-check.outputs.readable }}
          DEV_REVISION: ${{ needs.migration-check.outputs.dev_revision }}
          TARGET_HEAD: ${{ needs.migration-check.outputs.target_head }}
          MIGRATION_NEEDED: ${{ needs.migration-check.outputs.migration_needed }}
          CONFIRMED: ${{ inputs.migration_confirmed_current }}
        run: |
          echo "readable=$READABLE dev_revision=$DEV_REVISION target_head=$TARGET_HEAD migration_needed=$MIGRATION_NEEDED operator_confirmed=$CONFIRMED"

          if [ "$MIGRATION_NEEDED" = "false" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "run_migrations=false" >> "$GITHUB_OUTPUT"
            echo "DEV was read directly and is already at target_head ($TARGET_HEAD) - continuing automatically. Deploy runs with run_migrations=false, a verified no-op."
            exit 0
          fi

          if [ "$CONFIRMED" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "run_migrations=false" >> "$GITHUB_OUTPUT"
            echo "Operator explicitly set migration_confirmed_current=true - an out-of-band check confirmed DEV is already at $TARGET_HEAD. Continuing with run_migrations=false (the migration already happened outside this pipeline; this run does not attempt it again)."
            exit 0
          fi

          echo "proceed=false" >> "$GITHUB_OUTPUT"
          REASON="cannot verify from CI (DEV Postgres is not reachable from GitHub-hosted runners by design)"
          if [ "$MIGRATION_NEEDED" = "true" ]; then
            REASON="DEV is at $DEV_REVISION, candidate requires $TARGET_HEAD"
          fi
          {
            echo "## :no_entry: DEV DATABASE MIGRATION REQUIRED — CONTROLLED DBA/AZURE EXECUTION REQUIRED"
            echo ""
            echo "**Reason:** $REASON"
            echo ""
            echo "**This pipeline will not deploy candidate code against a schema it cannot verify is compatible.**"
            echo ""
            echo "### Runbook"
            echo "1. From an authorized network location that can reach \`docuaction-db-dev.postgres.database.azure.com\` (DEV Postgres's firewall trusts only the docuaction-dev App Service's own outbound IPs - this is deliberate and this pipeline does not widen it), connect as a principal that already **is**, or can \`SET ROLE\`, \`docuaction_owner\`."
            echo "2. Run \`alembic current\` first and confirm the starting revision."
            echo "3. If behind, run \`DB_APP_ROLE=docuaction_app alembic upgrade head\` (DB_APP_ROLE is required - some migrations grant privileges to that role by name, and refuse to guess if it is unset)."
            echo "4. Run \`alembic current\` again and confirm exactly one head, equal to \`$TARGET_HEAD\`."
            echo "5. Run \`alembic upgrade head\` a second time and confirm it is a true no-op."
            echo "6. \`docuaction_owner\` / \`docuaction_app\` privilege boundaries and all Area-1 permissions are unaffected by this - migrations that touch them already assert their own preconditions and fail rather than silently proceed."
            echo "7. Re-run this workflow (workflow_dispatch) with \`migration_confirmed_current: true\` to continue automatically."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::DEV DATABASE MIGRATION REQUIRED — CONTROLLED DBA/AZURE EXECUTION REQUIRED ($REASON)"
          exit 1

  deploy:
    name: Deploy to Azure DEV
    needs: [build, migration-gate, gov-baseline]
    if: needs.migration-gate.outputs.proceed == 'true'
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: dev
      image_tag: ${{ needs.build.outputs.tag }}
      run_migrations: ${{ needs.migration-gate.outputs.run_migrations }}
    permissions:
      contents: read
      id-token: write

  gov-verify:
    name: Verify Government data unchanged (read-only, after deploy)
    needs: [deploy, gov-baseline]
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login to Azure (OIDC - no stored client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Compare against the pre-deploy baseline
        env:
          BASELINE_JSON: ${{ needs.gov-baseline.outputs.baseline_json }}
        run: |
          python -m pip install --quiet psycopg2-binary
          PGTOKEN=$(az account get-access-token --resource https://ossrdbms-aad.database.windows.net --query accessToken -o tsv)
          test -n "$PGTOKEN" || { echo "FAIL: no PostgreSQL access token"; exit 1; }
          PGTOKEN="$PGTOKEN" python "$GITHUB_WORKSPACE/.github/scripts/gov_integrity_verify.py"

  security-smoke:
    name: Post-deploy security + migration smoke
    needs: [deploy, migration-check]
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous access to a protected route is refused
        run: |
          BASE="https://${DEV_APP}.azurewebsites.net"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/tefca/arc/reviews")
          echo "anonymous -> $CODE"
          case "$CODE" in 401|403) echo "correctly gated";; *) echo "FAIL: expected 401/403, got $CODE"; exit 1;; esac

      - name: An invalid bearer token is refused, not silently accepted
        run: |
          BASE="https://${DEV_APP}.azurewebsites.net"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer not-a-real-token.synthetic.certification" "$BASE/api/tefca/arc/reviews")
          echo "invalid bearer -> $CODE"
          case "$CODE" in 401|403) echo "correctly gated";; *) echo "FAIL: expected 401/403, got $CODE"; exit 1;; esac

      - name: DEV is not silently serving something unhealthy
        run: |
          BASE="https://${DEV_APP}.azurewebsites.net"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/health")
          test "$CODE" = "200" || { echo "FAIL: /health returned $CODE after deploy claimed success"; exit 1; }

  summary:
    name: Release summary
    needs: [build, migration-check, migration-gate, deploy, gov-verify, security-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record what shipped
        run: |
          {
            echo "## DEV release summary"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| commit | ${{ github.sha }} |"
            echo "| image tag | ${{ needs.build.outputs.tag }} |"
            echo "| image digest | ${{ needs.build.outputs.digest }} |"
            echo "| DEV readable from CI | ${{ needs.migration-check.outputs.readable }} |"
            echo "| DEV revision (last known) | ${{ needs.migration-check.outputs.dev_revision }} |"
            echo "| target head | ${{ needs.migration-check.outputs.target_head }} |"
            echo "| migration gate | ${{ needs.migration-gate.result }} (proceed=${{ needs.migration-gate.outputs.proceed }}) |"
            echo "| deployed digest | ${{ needs.deploy.outputs.deployed_digest }} |"
            echo "| previous image (rollback point) | ${{ needs.deploy.outputs.previous_image }} |"
            echo "| build result | ${{ needs.build.result }} |"
            echo "| deploy result | ${{ needs.deploy.result }} |"
            echo "| Government integrity result | ${{ needs.gov-verify.result }} |"
            echo "| security smoke result | ${{ needs.security-smoke.result }} |"
            echo "| triggered by | ${{ github.actor }} via ${{ github.event_name }} |"
            echo "| run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            if [ "${{ needs.migration-gate.outputs.proceed }}" != "true" ]; then
              echo ""
              echo "**BLOCKED at the controlled migration gate — see the migration-gate job's own summary for the exact runbook.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
