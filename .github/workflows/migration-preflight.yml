name: Migration Preflight (read-only)

# Proves the DEV migration path WITHOUT migrating.
#
# The deployment runs Alembic against the Government DEV database. Before that
# is ever authorised, four things have to be true, and each is asserted here:
#
#   1. the GitHub OIDC identity can obtain a short-lived Entra token for
#      PostgreSQL - no stored password anywhere;
#   2. that token authenticates against the DEV server;
#   3. the principal can SET ROLE docuaction_owner, so migrations create objects
#      owned by the owner role rather than by whoever happened to connect;
#   4. the schema revision it would migrate FROM is what we think it is.
#
# It never calls `alembic upgrade`. It opens one read-only connection, reads
# alembic_version, and exits. No Government business row is selected.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PGHOST: docuaction-db-dev.postgres.database.azure.com
  PGDATABASE: postgres
  PG_PRINCIPAL: github-actions-docuaction-backend-dev

jobs:
  preflight:
    runs-on: ubuntu-latest
    # The federated credential is bound to this environment's subject. A job
    # that does not declare it gets a token Azure refuses.
    environment: development
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Login to Azure (OIDC - no stored client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Token, connection and role assumption
        run: |
          python -m pip install --quiet psycopg2-binary
          # The token is minted here, stays a shell variable for the life of this
          # step, and is never echoed, exported to GITHUB_ENV, written to an
          # artifact or stored as a secret. It expires on its own in minutes.
          PGTOKEN=$(az account get-access-token \
            --resource https://ossrdbms-aad.database.windows.net \
            --query accessToken -o tsv)
          test -n "$PGTOKEN" || { echo "FAIL: no PostgreSQL access token"; exit 1; }
          echo "token acquired (${#PGTOKEN} chars, not printed)"
          PGTOKEN="$PGTOKEN" python - <<'PY'
          import os, psycopg2
          conn = psycopg2.connect(
              host=os.environ["PGHOST"], dbname=os.environ["PGDATABASE"],
              user=os.environ["PG_PRINCIPAL"], password=os.environ["PGTOKEN"],
              sslmode="require", connect_timeout=20)   # TLS required, not optional
          conn.autocommit = True
          c = conn.cursor()
          c.execute("select current_user"); print("authenticated as:", c.fetchone()[0])
          c.execute("set role docuaction_owner")
          c.execute("select current_user"); assumed = c.fetchone()[0]
          print("after SET ROLE   :", assumed)
          assert assumed == "docuaction_owner", "SET ROLE docuaction_owner did not take effect"
          c.execute("reset role")
          c.execute("select current_user"); print("after RESET ROLE :", c.fetchone()[0])
          # Schema metadata only. No Government business row is read.
          c.execute("select version_num from alembic_version")
          print("DEV alembic revision:", [r[0] for r in c.fetchall()])
          conn.close()
          print("PREFLIGHT OK - nothing was migrated")
          PY

      - name: Target head from the repository (offline)
        run: |
          # Offline: `alembic heads` reads the versions directory, not the
          # database. Exactly one head is a precondition for any upgrade.
          python -m pip install --quiet alembic
          alembic heads
