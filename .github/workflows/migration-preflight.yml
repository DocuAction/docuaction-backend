name: Migration Preflight (read-only)

# Proves the DEV migration path WITHOUT migrating.
#
# The deployment runs Alembic against the Government DEV database. Before that
# is ever authorised, four things have to be true, and each is asserted here:
#
#   1. the GitHub OIDC identity can obtain a short-lived Entra token for
#      PostgreSQL - no stored password anywhere;
#   2. that token authenticates against the DEV server;
#   3. the principal can SET ROLE docuaction_owner, so migrations create objects
#      owned by the owner role rather than by whoever happened to connect;
#   4. the schema revision it would migrate FROM is what we think it is.
#
# It never calls `alembic upgrade`. It opens one read-only connection, reads
# alembic_version, and exits. No Government business row is selected.

on:
  workflow_dispatch:
  # Lets dev-release.yml ask "does this release need to migrate?" as data
  # (jobs.preflight.outputs.migration_needed) instead of a human reading two
  # printed revision strings and typing 'true'/'false' into deploy-backend's
  # run_migrations dispatch input by hand.
  workflow_call:
    outputs:
      dev_revision:
        description: 'Current alembic_version row(s) in Azure DEV'
        value: ${{ jobs.preflight.outputs.dev_revision }}
      target_head:
        description: 'The single head this checkout would migrate to'
        value: ${{ jobs.preflight.outputs.target_head }}
      migration_needed:
        description: '"true" or "false" - DEV is not already at target_head'
        value: ${{ jobs.preflight.outputs.migration_needed }}

permissions:
  contents: read

env:
  PGHOST: docuaction-db-dev.postgres.database.azure.com
  PGDATABASE: postgres
  PG_PRINCIPAL: github-actions-docuaction-backend-dev

jobs:
  preflight:
    runs-on: ubuntu-latest
    # The federated credential is bound to this environment's subject. A job
    # that does not declare it gets a token Azure refuses.
    environment: development
    permissions:
      id-token: write
      contents: read
    outputs:
      dev_revision: ${{ steps.read.outputs.dev_revision }}
      target_head: ${{ steps.target.outputs.target_head }}
      migration_needed: ${{ steps.compare.outputs.migration_needed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Login to Azure (OIDC - no stored client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Token, connection and role assumption
        id: read
        run: |
          python -m pip install --quiet psycopg2-binary
          # The token is minted here, stays a shell variable for the life of this
          # step, and is never echoed, exported to GITHUB_ENV, written to an
          # artifact or stored as a secret. It expires on its own in minutes.
          PGTOKEN=$(az account get-access-token \
            --resource https://ossrdbms-aad.database.windows.net \
            --query accessToken -o tsv)
          test -n "$PGTOKEN" || { echo "FAIL: no PostgreSQL access token"; exit 1; }
          echo "token acquired (${#PGTOKEN} chars, not printed)"
          PGTOKEN="$PGTOKEN" python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys, psycopg2
          conn = psycopg2.connect(
              host=os.environ["PGHOST"], dbname=os.environ["PGDATABASE"],
              user=os.environ["PG_PRINCIPAL"], password=os.environ["PGTOKEN"],
              sslmode="require", connect_timeout=20)   # TLS required, not optional
          conn.autocommit = True
          c = conn.cursor()
          c.execute("select current_user"); print("authenticated as:", c.fetchone()[0], file=sys.stderr)
          c.execute("set role docuaction_owner")
          c.execute("select current_user"); assumed = c.fetchone()[0]
          print("after SET ROLE   :", assumed, file=sys.stderr)
          assert assumed == "docuaction_owner", "SET ROLE docuaction_owner did not take effect"
          c.execute("reset role")
          c.execute("select current_user"); print("after RESET ROLE :", c.fetchone()[0], file=sys.stderr)
          # Schema metadata only. No Government business row is read.
          c.execute("select version_num from alembic_version")
          rows = [r[0] for r in c.fetchall()]
          conn.close()
          print("DEV alembic_version rows:", rows, file=sys.stderr)
          # A bare row count, not a business-data read: exactly one row is the
          # only shape `alembic upgrade head` can safely start from. Zero means
          # the schema was never stamped; more than one means a prior multi-head
          # branch was never resolved. Either way this is a human decision, not
          # something the automated pipeline should guess its way through by
          # picking one of several revisions.
          assert len(rows) == 1, (
              f"DEV alembic_version has {len(rows)} rows, expected exactly 1 "
              f"({rows!r}) - stop and resolve this by hand before automating "
              f"a migration decision on top of it")
          print(f"dev_revision={rows[0]}")
          print("PREFLIGHT OK - nothing was migrated", file=sys.stderr)
          PY

      - name: Target head from the repository (offline)
        id: target
        run: |
          # Offline: `alembic heads` reads the versions directory, not the
          # database. Exactly one head is a precondition for any upgrade.
          python -m pip install --quiet alembic
          HEADS=$(alembic heads)
          echo "$HEADS"
          HEAD_LINES=$(echo "$HEADS" | grep '(head)' || true)
          COUNT=$(echo "$HEAD_LINES" | grep -c . || true)
          test "$COUNT" -eq 1 || { echo "FAIL: expected exactly one alembic head, found $COUNT - resolve the branch before this can run unattended"; exit 1; }
          TARGET=$(echo "$HEAD_LINES" | awk '{print $1}')
          echo "target_head=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Compare - is a migration actually needed
        id: compare
        run: |
          DEV="${{ steps.read.outputs.dev_revision }}"
          TARGET="${{ steps.target.outputs.target_head }}"
          echo "DEV is at:    $DEV"
          echo "target head:  $TARGET"
          if [ "$DEV" = "$TARGET" ]; then
            echo "migration_needed=false" >> "$GITHUB_OUTPUT"
            echo "DEV is already current - deploy-backend will be told run_migrations=false (a true no-op, not skipped-and-assumed-fine)"
          else
            echo "migration_needed=true" >> "$GITHUB_OUTPUT"
            echo "DEV is behind - deploy-backend will be told run_migrations=true"
          fi
