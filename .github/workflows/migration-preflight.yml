name: Migration Preflight / Controlled Apply (dedicated identity)

# The ONE database phase of the DEV release, on ONE runner.
#
# Read-only by default (preflight): proves the dedicated OIDC identity can mint
# a short-lived Entra token for PostgreSQL, authenticate, SET ROLE
# docuaction_owner, and read alembic_version. It never migrates unless the
# caller passes `apply: true` - which dev-release.yml only does from an
# explicit, human-authorised workflow_dispatch, never from a push.
#
# Everything that needs the same temporary runner IP lives in this single job
# deliberately: report IP -> operator adds one /32 -> connectivity -> read ->
# (apply -> verify) -> Government-integrity baseline. Spreading that across
# jobs would need one firewall window per runner. This identity holds NO
# permission to change firewall rules; the /32 is added and removed by an
# operator, out of band, for the life of this job only.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      apply:
        description: 'Execute pending approved migrations (dedicated identity, SET ROLE docuaction_owner). Default false = read-only preflight.'
        required: false
        type: boolean
        default: false
      expected_current:
        description: 'When apply=true: DEV must be at exactly this revision before anything runs (HARD STOP otherwise)'
        required: false
        type: string
        default: ''
      handshake_issue:
        description: 'When apply=true: PR/issue number where this job posts its runner IPv4 for the operator /32'
        required: false
        type: string
        default: ''
      target_revision:
        description: 'When apply=true: the exact revision to upgrade to. Must be the direct child of expected_current - one controlled migration per apply, never "head".'
        required: false
        type: string
        default: ''
    outputs:
      readable:
        description: '"true" if this runner could read alembic_version. Unreachable is an EXPECTED, routine result on push-triggered runs, not a workflow defect.'
        value: ${{ jobs.preflight.outputs.readable }}
      dev_revision:
        description: 'alembic_version in Azure DEV after this job (or UNREACHABLE_FROM_CI)'
        value: ${{ jobs.preflight.outputs.dev_revision }}
      target_head:
        description: 'The single head this checkout migrates to'
        value: ${{ jobs.preflight.outputs.target_head }}
      migration_needed:
        description: '"true", "false", or "unknown" - evaluated AFTER any apply'
        value: ${{ jobs.preflight.outputs.migration_needed }}
      applied:
        description: '"true" if a migration was executed in this run'
        value: ${{ jobs.preflight.outputs.applied }}
      baseline_readable:
        description: '"true" only if a real pre-deploy Government-integrity baseline was captured'
        value: ${{ jobs.preflight.outputs.baseline_readable }}
      baseline_json:
        value: ${{ jobs.preflight.outputs.baseline_json }}
      intake_count:
        value: ${{ jobs.preflight.outputs.intake_count }}

permissions:
  contents: read

env:
  PGHOST: docuaction-db-dev.postgres.database.azure.com
  PGDATABASE: postgres
  PG_PRINCIPAL: github-actions-docuaction-backend-dev
  DB_MIGRATION_ROLE: docuaction_owner
  DB_APP_ROLE: docuaction_app
  # Read-only role for the Government-integrity snapshot (SELECT only on
  # rce_source_records). Reviewed 2026-09-03: RLS off, no policies, no
  # BYPASSRLS - owner and runtime visibility are identical for that query,
  # and this is the only role the dedicated identity can assume without a
  # new grant. Deliberately its own variable; not DB_APP_ROLE, not
  # DB_MIGRATION_ROLE.
  DB_INTEGRITY_ROLE: docuaction_owner

jobs:
  preflight:
    runs-on: ubuntu-latest
    # The federated credential is bound to this environment's subject. A job
    # that does not declare it gets a token Azure refuses. Its required-reviewer
    # rule is also the human approval that stands in front of any apply.
    environment: development
    permissions:
      id-token: write
      contents: read
      # Only to post the runner IPv4 handshake comment (to an ISSUE, not a PR)
      # when apply=true. Nothing else in this job writes to GitHub.
      issues: write
    outputs:
      readable: ${{ steps.read.outputs.readable }}
      dev_revision: ${{ steps.final.outputs.dev_revision }}
      target_head: ${{ steps.target.outputs.target_head }}
      migration_needed: ${{ steps.final.outputs.migration_needed }}
      applied: ${{ steps.final.outputs.applied }}
      baseline_readable: ${{ steps.baseline.outputs.readable }}
      baseline_json: ${{ steps.baseline.outputs.baseline_json }}
      intake_count: ${{ steps.baseline.outputs.intake_count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Login to Azure (OIDC - no stored client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # AUTOMATED TEMPORARY AUTHORIZATION (2026-09-18) - replaces the manual
      # runner-IP handshake. The previous design posted the runner's IPv4 to
      # a GitHub issue and waited up to 20 minutes for a HUMAN to add a
      # temporary /32 firewall rule by hand - every dispatch needed a person
      # watching for that comment, and a run with nobody watching failed
      # closed after 20 minutes with nothing migrated (exactly what happened
      # on run 35362478212). This step now creates and later deletes that
      # same kind of rule itself, scoped to the exact runner IP for the exact
      # life of this job, using the OIDC-authenticated Azure session above -
      # no wider than the /32 a human would have added, no standing rule
      # left behind, no dependency on a handshake_issue for the
      # authorization itself (handshake_issue, when supplied, is still
      # accepted and still commented on for the audit trail - see below -
      # but nothing waits on a reply to it any more).
      - name: Detect and validate this runner's public IPv4
        if: inputs.apply == true
        id: runner_ip
        run: |
          IP=$(curl -s --max-time 10 https://api.ipify.org)
          echo "runner reports: '$IP'"
          # Validation logic lives in migration_firewall_authorization.py
          # (unit-tested in tests/test_migration_firewall_authorization.py)
          # rather than inline here, so the exact rule this job enforces is
          # independently testable without running the workflow itself.
          VALIDATED=$(python .github/scripts/migration_firewall_authorization.py validate-ip "$IP")
          echo "ip=$VALIDATED" >> "$GITHUB_OUTPUT"
          echo "validated runner IPv4: $VALIDATED"

      - name: Generate a unique firewall-rule name for this run
        if: inputs.apply == true
        id: rule_name
        run: |
          NAME=$(python .github/scripts/migration_firewall_authorization.py rule-name \
            "${{ github.run_id }}" "${{ github.run_attempt }}" "development")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "firewall rule name: $NAME"

      - name: Create the temporary firewall rule (exact runner /32, never a range)
        if: inputs.apply == true
        id: create_rule
        run: |
          test -n "${{ inputs.handshake_issue }}" || { echo "::error::apply=true requires handshake_issue"; exit 1; }
          test -n "${{ inputs.expected_current }}" || { echo "::error::apply=true requires expected_current"; exit 1; }
          test -n "${{ inputs.target_revision }}" || { echo "::error::apply=true requires target_revision"; exit 1; }
          IP="${{ steps.runner_ip.outputs.ip }}"
          NAME="${{ steps.rule_name.outputs.name }}"
          # Start IP and end IP are IDENTICAL - a single address, never a
          # range, and never the "Allow all Azure services" pseudo-rule
          # (0.0.0.0-0.0.0.0), which this step's own IP validation above has
          # already refused to accept as the detected IP in the first place.
          if ! az postgres flexible-server firewall-rule create \
              --resource-group rg-docuaction-DEV \
              --name docuaction-db-dev \
              --rule-name "$NAME" \
              --start-ip-address "$IP" \
              --end-ip-address "$IP" 2>&1 | tee /tmp/create_rule.log; then
            echo "::error::AUTHORIZATION/PERMISSION FAILURE creating firewall rule $NAME for $IP - the OIDC identity likely lacks Microsoft.DBforPostgreSQL/flexibleServers/firewallRules/write on docuaction-db-dev. See the Azure error above. Nothing was migrated; no rule was left behind (none was ever created)."
            exit 1
          fi
          echo "created rule $NAME: $IP - $IP"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Post audit-trail comment to the handshake issue (informational only - nothing waits on a reply)
        if: inputs.apply == true && steps.create_rule.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ inputs.handshake_issue }}" --repo "${{ github.repository }}" \
            --body "dev-release run ${{ github.run_id }} (attempt ${{ github.run_attempt }}): automatically authorized runner IPv4 **${{ steps.runner_ip.outputs.ip }}** as firewall rule \`${{ steps.rule_name.outputs.name }}\`. No manual action needed; the rule is removed automatically when this job ends." \
            || echo "::warning::could not comment on handshake issue ${{ inputs.handshake_issue }} - continuing, this is audit-trail only and does not gate the migration"

      - name: Poll for connectivity (bounded, up to 5 minutes)
        if: inputs.apply == true && steps.create_rule.outputs.created == 'true'
        run: |
          for i in $(seq 1 30); do
            if python -c "import socket;s=socket.socket();s.settimeout(5);s.connect(('$PGHOST',5432))" 2>/dev/null; then
              echo "DEV Postgres reachable after $i attempt(s) (rule propagation)"; exit 0
            fi
            sleep 10
          done
          echo "::error::FIREWALL/NETWORK FAILURE - DEV Postgres not reachable within 5 minutes even though firewall rule ${{ steps.rule_name.outputs.name }} for ${{ steps.runner_ip.outputs.ip }} was created successfully. This is a network-path failure, distinct from an authorization failure (the rule creation above already succeeded) - possibly Azure firewall-rule propagation delay, or the server is down. Nothing was migrated."
          exit 1

      - name: Token, connection and role assumption
        id: read
        run: |
          python -m pip install --quiet psycopg2-binary
          # The token is minted here, stays a shell variable for the life of this
          # step, and is never echoed, exported to GITHUB_ENV, written to an
          # artifact or stored as a secret. It expires on its own in minutes.
          PGTOKEN=$(az account get-access-token \
            --resource https://ossrdbms-aad.database.windows.net \
            --query accessToken -o tsv)
          test -n "$PGTOKEN" || { echo "FAIL: no PostgreSQL access token"; exit 1; }
          echo "token acquired (${#PGTOKEN} chars, not printed)"
          PGTOKEN="$PGTOKEN" python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys, psycopg2

          # DEV Postgres's firewall trusts only the docuaction-dev App Service's own
          # outbound IPs. A GitHub-hosted runner is deliberately NOT on that list,
          # and widening it to admit GitHub's dynamic IP ranges would be exactly the
          # kind of firewall weakening this pipeline must not do on its own. So a
          # connection timeout here is an EXPECTED, routine outcome on push runs -
          # distinguished from every OTHER failure (bad auth, wrong role, unexpected
          # schema state), which still fail loudly below.
          try:
              conn = psycopg2.connect(
                  host=os.environ["PGHOST"], dbname=os.environ["PGDATABASE"],
                  user=os.environ["PG_PRINCIPAL"], password=os.environ["PGTOKEN"],
                  sslmode="require", connect_timeout=20)   # TLS required, not optional
          except psycopg2.OperationalError as exc:
              # psycopg2 raises the SAME exception class for a network-level
              # failure (connection refused/timed out - the firewall
              # blocked it) and an authentication-level failure (Entra token
              # accepted by Azure but Postgres itself rejects it - wrong
              # role, expired token, misconfigured AAD mapping). Treating
              # both as "expected, not reachable" would silently swallow a
              # real auth problem as if it were routine. Distinguish by the
              # server's own message: Postgres phrases an auth rejection
              # with "password authentication failed" or "no pg_hba.conf
              # entry"; anything else at this stage is the network path.
              msg = str(exc)
              if "password authentication failed" in msg or "pg_hba.conf" in msg or "no encryption" in msg:
                  print(f"::error::AUTHENTICATION FAILURE connecting to DEV Postgres as "
                        f"{os.environ['PG_PRINCIPAL']!r}: {exc}", file=sys.stderr)
                  print("This is NOT the expected firewall-blocked case - the network path "
                        "was reachable and Postgres itself rejected the credential. Stopping; "
                        "nothing was migrated.", file=sys.stderr)
                  sys.exit(1)
              print(f"FIREWALL/NETWORK FAILURE - DEV Postgres is not reachable from this "
                    f"runner: {exc}", file=sys.stderr)
              print("EXPECTED on push-triggered runs (no apply requested, no firewall rule "
                    "authorized this runner): reporting readable=false; dev-release.yml's "
                    "migration gate decides what to do. On an apply=true run reaching this "
                    "branch, the firewall rule created earlier in this job did not actually "
                    "authorize connectivity - see the polling step above, which should have "
                    "already caught this case.", file=sys.stderr)
              print("readable=false")
              print("dev_revision=UNREACHABLE_FROM_CI")
              sys.exit(0)

          conn.autocommit = True
          c = conn.cursor()
          c.execute("select current_user"); print("authenticated as:", c.fetchone()[0], file=sys.stderr)
          c.execute("set role docuaction_owner")
          c.execute("select current_user"); assumed = c.fetchone()[0]
          print("after SET ROLE   :", assumed, file=sys.stderr)
          assert assumed == "docuaction_owner", "DATABASE-ROLE FAILURE: SET ROLE docuaction_owner did not take effect"
          # Schema metadata only. No Government business row is read. Read it
          # WHILE the owner role is assumed: the dedicated identity holds no
          # privilege of its own on alembic_version - only through
          # docuaction_owner - and reading after RESET ROLE failed with
          # "permission denied for table alembic_version" (run 33700590253),
          # the first time this step ever reached the database from CI.
          c.execute("select version_num from alembic_version")
          rows = [r[0] for r in c.fetchall()]
          c.execute("reset role")
          c.execute("select current_user"); print("after RESET ROLE :", c.fetchone()[0], file=sys.stderr)
          conn.close()
          print("DEV alembic_version rows:", rows, file=sys.stderr)
          # Exactly one row is the only shape `alembic upgrade head` can safely
          # start from. Zero or several is a human decision, not something the
          # pipeline should guess its way through.
          assert len(rows) == 1, (
              f"ALEMBIC REVISION MISMATCH: DEV alembic_version has {len(rows)} rows, "
              f"expected exactly 1 ({rows!r}) - multiple/zero heads is a human decision, "
              f"stop and resolve this by hand before automating "
              f"a migration decision on top of it")
          print("readable=true")
          print(f"dev_revision={rows[0]}")
          print("PREFLIGHT OK - nothing was migrated", file=sys.stderr)
          PY

      - name: Target head from the repository (offline)
        id: target
        run: |
          # Offline: `alembic heads` reads the versions directory, not the
          # database. Exactly one head is a precondition for any upgrade.
          python -m pip install --quiet alembic
          HEADS=$(alembic heads)
          echo "$HEADS"
          HEAD_LINES=$(echo "$HEADS" | grep '(head)' || true)
          COUNT=$(echo "$HEAD_LINES" | grep -c . || true)
          test "$COUNT" -eq 1 || { echo "FAIL: expected exactly one alembic head, found $COUNT - resolve the branch before this can run unattended"; exit 1; }
          TARGET=$(echo "$HEAD_LINES" | awk '{print $1}')
          echo "target_head=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Compare - is a migration actually needed
        id: compare
        run: |
          READABLE="${{ steps.read.outputs.readable }}"
          DEV="${{ steps.read.outputs.dev_revision }}"
          # A targeted apply compares against the one revision it was asked to
          # reach; a read-only/push-triggered run has no target_revision and
          # falls back to the repository's single head, unchanged from before.
          TARGET="${{ inputs.target_revision }}"
          if [ -z "$TARGET" ]; then TARGET="${{ steps.target.outputs.target_head }}"; fi
          echo "DEV readable from this runner: $READABLE"
          echo "DEV is at:    $DEV"
          echo "target head:  $TARGET"
          if [ "$READABLE" != "true" ]; then
            echo "migration_needed=unknown" >> "$GITHUB_OUTPUT"
            echo "Cannot determine from CI whether a migration is needed - DEV is not reachable from this runner by design."
            exit 0
          fi
          if [ "$DEV" = "$TARGET" ]; then
            echo "migration_needed=false" >> "$GITHUB_OUTPUT"
            echo "DEV is already current."
          else
            echo "migration_needed=true" >> "$GITHUB_OUTPUT"
            echo "DEV is behind."
          fi

      - name: Apply the approved migration as docuaction_owner, then verify
        id: apply
        if: inputs.apply == true && steps.compare.outputs.migration_needed == 'true'
        env:
          SECRET_KEY: ${{ github.sha }}${{ github.sha }}
          ALLOWED_HOSTS: '*'
        run: |
          CUR="${{ steps.read.outputs.dev_revision }}"; TARGET="${{ inputs.target_revision }}"
          test "$CUR" = "${{ inputs.expected_current }}" || { echo "::error::ALEMBIC REVISION MISMATCH - DEV is at $CUR, operator expected ${{ inputs.expected_current }} (divergent or ahead of what was confirmed) - nothing executed"; exit 1; }
          python -m pip install --quiet -r requirements.txt
          # target_revision must be the DIRECT CHILD of CUR - one controlled
          # migration per apply, never zero (target == CUR, its own node has no
          # down_revision equal to itself) and never more than one (a revision
          # further down the chain, or an unrelated branch). Replaces an earlier
          # "count pending revisions to heads" check, which conflated "how many
          # migrations to head" with "is this specific target one step away" -
          # the two only agree when the target IS head, which a controlled apply
          # to an intermediate revision must not assume (run 35154986185, which
          # correctly refused to execute anything against a two-step gap).
          PARENT=$(python -c "
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          sd = ScriptDirectory.from_config(Config('alembic.ini'))
          down = sd.get_revision('${TARGET}').down_revision
          if isinstance(down, tuple):
              down = down[0] if len(down) == 1 else None
          print(down or '')
          ")
          echo "target_revision $TARGET has parent: $PARENT"
          test "$PARENT" = "$CUR" || { echo "::error::ALEMBIC REVISION MISMATCH - target_revision $TARGET is not the direct child of $CUR (its parent is '$PARENT'; DEV is unknown, divergent, or not a valid ancestor of the requested target) - nothing executed"; exit 1; }
          PGTOKEN=$(az account get-access-token --resource https://ossrdbms-aad.database.windows.net --query accessToken -o tsv)
          export DATABASE_URL="postgresql://${PG_PRINCIPAL}:${PGTOKEN}@${PGHOST}/${PGDATABASE}?ssl=require"
          echo "--- identity check via the approved DB_MIGRATION_ROLE mechanism (startup-packet role) ---"
          PGTOKEN="$PGTOKEN" python - <<'PY'
          import asyncio, os, asyncpg
          async def m():
              c = await asyncpg.connect(host=os.environ["PGHOST"], database=os.environ["PGDATABASE"],
                                        user=os.environ["PG_PRINCIPAL"], password=os.environ["PGTOKEN"], ssl="require",
                                        server_settings={"role": os.environ["DB_MIGRATION_ROLE"]})
              r = await c.fetchrow("select session_user, current_user"); await c.close()
              print("session_user =", r[0], "| current_user =", r[1])
              assert r[0] == os.environ["PG_PRINCIPAL"], "session_user is not the dedicated migration identity"
              assert r[1] == os.environ["DB_MIGRATION_ROLE"], "current_user is not docuaction_owner - refusing to run DDL"
          asyncio.run(m())
          PY
          echo "--- alembic upgrade $TARGET (DB_MIGRATION_ROLE=$DB_MIGRATION_ROLE DB_APP_ROLE=$DB_APP_ROLE) ---"
          alembic upgrade "$TARGET"
          AFTER=$(alembic current 2>/dev/null | awk '{print $1}'); echo "after: $AFTER"
          test "$AFTER" = "$TARGET" || { echo "::error::after upgrade DEV is at $AFTER, expected $TARGET"; exit 1; }
          test "$(alembic heads | grep -c '(head)')" -eq 1 || { echo "::error::ALEMBIC REVISION MISMATCH - multiple heads after upgrade"; exit 1; }
          echo "--- second run must be a true no-op ---"
          alembic upgrade "$TARGET" 2>&1 | tee /tmp/second.log
          if grep -q "Running upgrade" /tmp/second.log; then echo "::error::second alembic upgrade $TARGET was not a no-op"; exit 1; fi
          echo "--- runtime privileges on rce_delivery_jobs (S/I/U must be true, DELETE must be false) ---"
          PGTOKEN="$PGTOKEN" python - <<'PY'
          import os, psycopg2
          c = psycopg2.connect(host=os.environ["PGHOST"], dbname=os.environ["PGDATABASE"], user=os.environ["PG_PRINCIPAL"],
                               password=os.environ["PGTOKEN"], sslmode="require").cursor()
          c.execute("select to_regclass('public.rce_delivery_jobs') is not null"); exists = c.fetchone()[0]
          if exists:
              got = {}
              for p in ("SELECT", "INSERT", "UPDATE", "DELETE"):
                  c.execute("select has_table_privilege(%s,'rce_delivery_jobs',%s)", (os.environ["DB_APP_ROLE"], p)); got[p] = c.fetchone()[0]
              c.execute("select tableowner from pg_tables where tablename='rce_delivery_jobs'"); owner = c.fetchone()[0]
              print("privileges:", got, "| owner:", owner)
              assert got == {"SELECT": True, "INSERT": True, "UPDATE": True, "DELETE": False}, "runtime privileges are not the approved least-privilege set"
              assert owner == os.environ["DB_MIGRATION_ROLE"], "rce_delivery_jobs is not owned by docuaction_owner"
          else:
              print("rce_delivery_jobs not present - privilege invariant not applicable")
          PY
          echo "applied=true" >> "$GITHUB_OUTPUT"
          echo "dev_revision_after=$AFTER" >> "$GITHUB_OUTPUT"

      - name: Capture Government-integrity baseline (read-only, before deploy)
        id: baseline
        if: steps.read.outputs.readable == 'true'
        run: |
          PGTOKEN=$(az account get-access-token --resource https://ossrdbms-aad.database.windows.net --query accessToken -o tsv)
          test -n "$PGTOKEN" || { echo "FAIL: no PostgreSQL access token"; exit 1; }
          PGTOKEN="$PGTOKEN" python "$GITHUB_WORKSPACE/.github/scripts/gov_integrity_snapshot.py" >> "$GITHUB_OUTPUT"

      - name: Final gate inputs (after any apply)
        id: final
        run: |
          if [ "${{ steps.apply.outputs.applied }}" = "true" ]; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
            echo "migration_needed=false" >> "$GITHUB_OUTPUT"
            echo "dev_revision=${{ steps.apply.outputs.dev_revision_after }}" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "migration_needed=${{ steps.compare.outputs.migration_needed }}" >> "$GITHUB_OUTPUT"
            echo "dev_revision=${{ steps.read.outputs.dev_revision }}" >> "$GITHUB_OUTPUT"
          fi
          echo "baseline_readable=${{ steps.baseline.outputs.readable }}"

      # CLEANUP - if: always() so this runs after success, a migration
      # failure, an authentication/authorization failure, the 5-minute
      # connectivity timeout, a later step's failure, OR cancellation
      # (GitHub still runs already-started `if: always()` steps on a
      # graceful cancellation; a hard/forced cancellation past GitHub's
      # grace period can still skip it - noted, not something a workflow
      # step can control). A later job's failure (e.g. the deploy job, which
      # runs after this one completes) has nothing to clean up here: this
      # rule's entire lifecycle is contained within THIS job, deleted before
      # the job ends either way.
      - name: Delete the temporary firewall rule
        if: always() && inputs.apply == true && steps.create_rule.outputs.created == 'true'
        id: delete_rule
        run: |
          NAME="${{ steps.rule_name.outputs.name }}"
          if az postgres flexible-server firewall-rule delete \
              --resource-group rg-docuaction-DEV \
              --name docuaction-db-dev \
              --rule-name "$NAME" \
              --yes 2>&1 | tee /tmp/delete_rule.log; then
            echo "deleted=true" >> "$GITHUB_OUTPUT"
          else
            echo "deleted=false" >> "$GITHUB_OUTPUT"
            echo "::error::failed to delete firewall rule $NAME - see the cleanup-verification step for the residual-rule report"
          fi

      - name: Verify the temporary rule no longer exists (queries Azure, does not trust the delete call's own exit code alone)
        if: always() && inputs.apply == true && steps.create_rule.outputs.created == 'true'
        run: |
          NAME="${{ steps.rule_name.outputs.name }}"
          REMAINING=$(az postgres flexible-server firewall-rule show \
              --resource-group rg-docuaction-DEV \
              --name docuaction-db-dev \
              --rule-name "$NAME" \
              --query name -o tsv 2>/dev/null || echo "")
          if [ -n "$REMAINING" ]; then
            echo "::error::CLEANUP FAILED - firewall rule '$NAME' (runner IP ${{ steps.runner_ip.outputs.ip }}) still exists on docuaction-db-dev after the delete step. This release is NO-GO until an operator removes it by hand: az postgres flexible-server firewall-rule delete --resource-group rg-docuaction-DEV --name docuaction-db-dev --rule-name $NAME --yes"
            exit 1
          fi
          echo "confirmed: rule $NAME no longer exists on docuaction-db-dev"
