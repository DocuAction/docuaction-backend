name: Container Release Candidate

# WHY THIS WORKFLOW EXISTS
# ------------------------
# DEV and PROD are Azure App Service CUSTOM CONTAINER apps:
#
#   DEV   DOCKER|acrdocuactiondev.azurecr.io/docuaction-backend:<commit>
#   PROD  DOCKER|acrdocuactionprod.azurecr.io/docuaction-backend@sha256:<digest>
#
# The Dockerfile sets WORKDIR /app, COPY . ., and starts gunicorn from inside
# the image. DEV additionally has WEBSITES_ENABLE_APP_SERVICE_STORAGE=false, so
# /home/site/wwwroot is not even mounted into the running container.
#
# deploy-backend.yml used to ship a ZIP via `az webapp deploy --type zip`. For
# these apps that is architecturally wrong: the ZIP lands somewhere the running
# container cannot see, so the deployment reports success while the app keeps
# running the OLD image. A silent no-op is worse than a failure, because it is
# recorded as a successful release of code that never actually ran.
#
# The deployable release unit is therefore an OCI IMAGE identified by an
# immutable digest, and this workflow is what produces one.
#
# THIS WORKFLOW NEVER DEPLOYS. Building and pushing an image does not authorise
# any App Service to run it.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Exact commit SHA or tag to build (not a branch name)'
        required: true
        type: string
      push:
        description: 'Push to the DEV registry (uses the DEV environment OIDC identity). Off = build and smoke only.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  DEV_REGISTRY: acrdocuactiondev
  DEV_LOGIN_SERVER: acrdocuactiondev.azurecr.io
  IMAGE_REPO: docuaction-backend

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      sha: ${{ steps.identity.outputs.sha }}

    services:
      # A throwaway Postgres. Startup runs create_all(), so without a database
      # /health would not be a real check - it would only prove the image can
      # fail to start. Synthetic credentials, thrown away with the job.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - name: Checkout the exact ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Derive immutable image identity from the commit
        id: identity
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$SHORT" >> "$GITHUB_OUTPUT"
          echo "commit $SHA -> image tag $SHORT"

      - name: Build the container image
        run: |
          # The repository's real Dockerfile and real .dockerignore, which
          # excludes .env*, tests/, docs/, .claude/, .secrets.baseline, venvs.
          docker build -t "candidate:${{ steps.identity.outputs.tag }}" -f Dockerfile .

      - name: Image carries no secrets and no build cruft
        run: |
          IMG="candidate:${{ steps.identity.outputs.tag }}"
          echo "--- .env files (must be none) ---"
          COUNT=$(docker run --rm --entrypoint sh "$IMG" -c 'find / -name ".env" -o -name ".env.*" 2>/dev/null | wc -l')
          echo "found: $COUNT"
          test "$COUNT" -eq 0 || { echo "FAIL: an .env file is baked into the image"; exit 1; }
          echo "--- tests/ and docs/ must not ship ---"
          docker run --rm --entrypoint sh "$IMG" -c 'test ! -d /app/tests && test ! -d /app/docs' || { echo "FAIL: test or doc trees shipped in the runtime image"; exit 1; }
          echo "--- runtime user must not be root ---"
          UID_IN_IMAGE=$(docker run --rm --entrypoint sh "$IMG" -c 'id -u')
          echo "uid: $UID_IN_IMAGE"
          test "$UID_IN_IMAGE" -ne 0 || { echo "FAIL: container runs as root"; exit 1; }

      - name: Required runtime dependencies are present in the image
        run: |
          IMG="candidate:${{ steps.identity.outputs.tag }}"
          docker run --rm --entrypoint python "$IMG" -c "import app.main; print('application imports OK')"
          docker run --rm --entrypoint python "$IMG" -c "import gunicorn, uvicorn; print('gunicorn + uvicorn OK')"
          docker run --rm --entrypoint python "$IMG" -c "import alembic; print('alembic OK')"
          docker run --rm --entrypoint python "$IMG" -c "import azure.storage.blob, azure.identity; print('azure deps OK')"
          docker run --rm --entrypoint python "$IMG" -c "import openpyxl, matplotlib, jinja2; print('report deps OK')"
          # WeasyPrint AND its native stack. Importing is not enough - the whole
          # point of this Linux image is that the native libraries actually load.
          docker run --rm --entrypoint python "$IMG" -c "from app.reports.engine.pdf_engine import pdf_available, unavailable_reason; assert pdf_available(), unavailable_reason(); print('WeasyPrint native stack OK')"
          # The migration scripts must be IN the image: the deployment runs them.
          docker run --rm --entrypoint sh "$IMG" -c 'test -f /app/alembic.ini && ls /app/alembic/versions/ | head -1' && echo "alembic versions present"

      - name: Smoke test - the container starts and serves /health
        run: |
          IMG="candidate:${{ steps.identity.outputs.tag }}"
          # --network host so the container can reach the Postgres service the
          # job published on the runner. Synthetic throwaway configuration only:
          # nothing here is a real credential, and nothing points at DEV or PROD.
          docker run -d --name candidate --network host -e ENVIRONMENT=test -e SECRET_KEY=smoke-test-not-a-real-key-000000000000000000000000000000000000 -e ALLOWED_HOSTS='*' -e ALLOWED_ORIGINS='*' -e DATABASE_URL='postgresql+asyncpg://smoke:smoke@127.0.0.1:5432/smoke' -e PORT=8080 "$IMG"
          echo "waiting for /health ..."
          CODE=000
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8080/health || true)
            if [ "$CODE" = "200" ]; then echo "health OK after $i attempt(s)"; head -c 400 /tmp/health.json; echo; break; fi
            sleep 3
          done
          if [ "$CODE" != "200" ]; then echo "FAIL: /health did not return 200 (last: $CODE)"; docker logs candidate 2>&1 | tail -60; exit 1; fi
          echo "--- startup schema mutation must be reported, not silent ---"
          docker logs candidate 2>&1 | grep -i "schema" | head -5 || echo "(no schema messages)"

      - name: Stop and remove the smoke container
        if: always()
        run: docker rm -f candidate || true

  push-to-dev-acr:
    # Build AND smoke must pass before anything reaches a registry.
    needs: build-and-smoke
    if: inputs.push
    runs-on: ubuntu-latest
    # The DEV environment is the trust boundary, not a label. The federated
    # credential in Entra is bound to the subject
    #   repo:DocuAction/docuaction-backend:environment:development
    # so a job that does NOT declare this environment gets a token Azure will
    # refuse. A fork, a pull request or an arbitrary branch cannot borrow it.
    environment: development
    permissions:
      # The ONLY reason this is here: azure/login needs to mint the short-lived
      # GitHub OIDC token it exchanges for an Azure token. Nothing is stored.
      id-token: write
      contents: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout the exact ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Login to Azure (OIDC - no stored client secret)
        uses: azure/login@v2
        with:
          # Identifiers, not credentials: a client id, a tenant id and a
          # subscription id are all discoverable from any resource in the
          # tenant and authenticate nothing on their own. They are environment
          # VARIABLES rather than secrets so that the audit trail shows which
          # identity ran, which a masked secret would hide. The credential
          # itself is the federated trust in Entra plus this job's OIDC token,
          # which lives for minutes and cannot leave the runner.
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push to the DEV registry only
        run: |
          # DEV registry ONLY. Promotion to the PROD registry is a separate and
          # separately authorised step, and never happens here.
          az acr build --registry ${{ env.DEV_REGISTRY }} --image ${{ env.IMAGE_REPO }}:${{ needs.build-and-smoke.outputs.tag }} --file Dockerfile .

      - name: Capture the immutable digest
        id: digest
        run: |
          DIGEST=$(az acr manifest show-metadata ${{ env.DEV_LOGIN_SERVER }}/${{ env.IMAGE_REPO }}:${{ needs.build-and-smoke.outputs.tag }} --query digest -o tsv)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "$DIGEST"

      - name: Publish release metadata
        run: |
          {
            echo "## Container release candidate"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| commit | ${{ needs.build-and-smoke.outputs.sha }} |"
            echo "| ref built | ${{ inputs.ref }} |"
            echo "| image tag | ${{ needs.build-and-smoke.outputs.tag }} |"
            echo "| digest | ${{ steps.digest.outputs.digest }} |"
            echo "| registry | ${{ env.DEV_LOGIN_SERVER }} |"
            echo "| CI run | ${{ github.run_id }} |"
            echo ""
            echo "NOT DEPLOYED. Pushing an image does not authorise any App Service"
            echo "to run it. DEV deployment is a separate, explicitly authorised step."
          } >> "$GITHUB_STEP_SUMMARY"
