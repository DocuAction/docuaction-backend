name: DEV Read-Only Ownership Diagnostic (report_export_jobs)

# Reads who owns public.report_export_jobs and public.rce_delivery_stage_events
# on DEV, their ACLs, the runtime role's effective privileges, the current
# Alembic revision and the migration identity's role memberships. Prepared
# after DEV release run 37272045742 failed on revision
# 20261001_report_generation_jobs with "must be owner of table
# report_export_jobs", so that a repair is chosen from facts, not assumptions.
#
# READ ONLY. The script runs one `BEGIN TRANSACTION READ ONLY` that always
# ends in ROLLBACK. No DDL, no GRANT/REVOKE, no ownership change, no
# migration, no deployment, no business row. It never selects
# environment: production.
#
# NOTHING NEW IN HOW IT CONNECTS. Same dedicated OIDC identity, same
# temporary runner-IP handshake, same bounded wait and same login refresh as
# migration-preflight.yml (the path that connected successfully in run
# 37272045742). Steps are taken from the reviewed shape of
# dev-readonly-diagnostic.yml (PR #111): pinned action SHAs, inputs passed
# through `env:` rather than interpolated into shell, handshake_issue
# validated as a positive integer.
#
# FIREWALL. This identity cannot create or remove a firewall rule. The
# operator adds a temporary /32 for the IPv4 this run posts on the handshake
# issue, and removes it when the run finishes. Every run has its own runner
# and its own address; an address from an earlier run must never be reused.
#
# `docuaction_owner` is assumed only to read alembic_version, exactly as
# migration-preflight.yml does. Read-only behaviour comes from the READ ONLY
# transaction and from what the script executes.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this diagnostic is being run (posted on the handshake issue for the record)'
        required: true
        type: string
      handshake_issue:
        description: 'Issue NUMBER (positive integer) where this job posts its runner IPv4 for the operator temporary /32'
        required: true
        type: string

permissions:
  contents: read

env:
  PGHOST: docuaction-db-dev.postgres.database.azure.com
  PGDATABASE: postgres
  PG_PRINCIPAL: github-actions-docuaction-backend-dev

jobs:
  diagnostic:
    name: Read-only ownership diagnostic (DEV)
    runs-on: ubuntu-latest
    environment: development   # required-reviewer gate, same as migration-preflight.yml
    permissions:
      id-token: write
      contents: read
      issues: write   # the handshake comments only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the one driver this script needs
        run: python -m pip install --quiet psycopg2-binary

      - name: Validate handshake_issue is a positive integer
        env:
          HANDSHAKE_ISSUE: ${{ inputs.handshake_issue }}
        run: |
          case "$HANDSHAKE_ISSUE" in
            ''|*[!0-9]*)
              echo "::error::handshake_issue must be a positive integer issue number; got '$HANDSHAKE_ISSUE'"
              exit 1
              ;;
          esac
          if [ "$HANDSHAKE_ISSUE" -le 0 ]; then
            echo "::error::handshake_issue must be a positive integer issue number; got '$HANDSHAKE_ISSUE'"
            exit 1
          fi

      - name: Login to Azure (OIDC - no stored client secret)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Report runner IPv4 and wait for the operator's temporary /32 (bounded)
        env:
          GH_TOKEN: ${{ github.token }}
          HANDSHAKE_ISSUE: ${{ inputs.handshake_issue }}
          RUN_REASON: ${{ inputs.reason }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          IP=$(curl -s https://api.ipify.org)
          echo "runner public IPv4: $IP"
          gh issue comment "$HANDSHAKE_ISSUE" --repo "$REPO" \
            --body "dev-ownership-readonly-diagnostic run $RUN_ID (\"$RUN_REASON\"): runner public IPv4 **$IP** - waiting up to 20 min for a temporary /32 (start = end = this address; do not reuse an address from an earlier run). Remove it when this run finishes. This identity cannot add or remove it itself."
          for i in $(seq 1 80); do
            if python -c "import socket;s=socket.socket();s.settimeout(5);s.connect(('$PGHOST',5432))" 2>/dev/null; then
              echo "DEV Postgres reachable after $i attempt(s)"; exit 0
            fi
            sleep 15
          done
          echo "::error::DEV Postgres not reachable within 20 minutes - no /32 was authorised. Failing closed; nothing was read."
          exit 1

      - name: Refresh Azure OIDC login after the bounded firewall wait
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run the read-only ownership diagnostic
        run: |
          # Minted here, held in a shell variable for this step only; never
          # echoed, exported to GITHUB_ENV, or written to a file or artifact.
          PGTOKEN=$(az account get-access-token \
            --resource https://ossrdbms-aad.database.windows.net \
            --query accessToken -o tsv)
          test -n "$PGTOKEN" || { echo "FAIL: no PostgreSQL access token"; exit 1; }
          echo "token acquired (${#PGTOKEN} chars, not printed)"
          PGTOKEN="$PGTOKEN" python scripts/dev_readonly_diagnostics/ownership_report_export_jobs.py

      - name: Tell the operator the temporary /32 can be removed now
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HANDSHAKE_ISSUE: ${{ inputs.handshake_issue }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$HANDSHAKE_ISSUE" in ''|*[!0-9]*) exit 0;; esac
          gh issue comment "$HANDSHAKE_ISSUE" --repo "$REPO" \
            --body "dev-ownership-readonly-diagnostic run $RUN_ID finished ($JOB_STATUS). Remove the temporary /32 added for this run now, then confirm no temporary rule remains." || true
