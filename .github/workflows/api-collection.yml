name: api-collection

# Deterministic API integration tests: a Newman run of the Git-managed Postman
# collection (tests/postman/) against an ISOLATED backend — disposable
# PostgreSQL, synthetic accounts and one synthetic promoted delivery seeded by
# scripts/seed_integration_fixtures.py, a real uvicorn bound on 127.0.0.1.
#
# No external source is called at scale and the October population is never
# touched. The collection folders tagged (requires #193)/(requires #194)
# self-report "not on this build" when those routes are absent (this branch is
# based on main); they assert fully once those PRs land. Core endpoints
# (health, auth, authorization, reconciliation, reports) are always asserted.
#
# Security posture: pull_request (never pull_request_target — no untrusted PR
# code runs with secrets), least-privilege token, pinned actions, and the
# fixture manifest (which carries synthetic passwords) is NEVER uploaded — only
# the JUnit report and the server log are.

on:
  push:
    branches: ['ci/github-api-ui-integration-2026-11-01']
  pull_request:
    paths:
      - 'tests/postman/**'
      - 'scripts/seed_integration_fixtures.py'
      - '.github/workflows/api-collection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-collection:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: apitest
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SECRET_KEY: apicollectionapicollectionapicollectionapicollectionapicollection
      ALLOWED_HOSTS: '*'
      ALLOWED_ORIGINS: http://127.0.0.1:8010
      DATABASE_URL: postgresql+asyncpg://docuaction_owner:x@127.0.0.1:5432/itest
      DB_MIGRATION_ROLE: docuaction_owner
      DB_APP_ROLE: docuaction_app
      ENABLE_SAM_EXTRACT_SCREENING: 'true'
      ENTITY_RESOLVER_SOURCE: db
      PGPASSWORD: apitest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install uvicorn
      - name: Create the isolated database and roles (owner / app split, UTC)
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE docuaction_owner LOGIN PASSWORD 'x';" \
            -c "CREATE ROLE docuaction_app LOGIN PASSWORD 'x';" \
            -c "CREATE DATABASE itest OWNER docuaction_owner;" \
            -c "ALTER DATABASE itest SET timezone = 'UTC';"
          psql -h 127.0.0.1 -U postgres -d itest -v ON_ERROR_STOP=1 \
            -c "ALTER SCHEMA public OWNER TO docuaction_owner;" \
            -c "GRANT ALL ON SCHEMA public TO docuaction_owner;" \
            -c "GRANT USAGE, CREATE ON SCHEMA public TO docuaction_app;"
      - name: Migrate to head (Alembic, owner role)
        run: python -m alembic upgrade head
      - name: Start the isolated backend (127.0.0.1:8010)
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 > api-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8010/health > /dev/null; then echo "server up"; exit 0; fi
            sleep 1
          done
          echo "::error::backend did not become healthy within 30s"; cat api-server.log; exit 1
      - name: Seed deterministic synthetic fixtures
        run: python scripts/seed_integration_fixtures.py --out integration-fixtures.json
      - name: Install the Postman CLI (official installer; no npm tree)
        run: |
          curl -sSL -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
          postman --version
      - name: Run the API collection (Postman CLI -> JUnit)
        working-directory: tests/postman
        # Local collection file, no Postman API key (results are not synced to
        # Postman cloud). The runner injects synthetic creds + seeded ids and
        # enforces the local-host guard.
        run: node run.mjs --manifest ../../integration-fixtures.json --baseUrl http://127.0.0.1:8010 --junit newman-results.xml
      - name: Stop the backend
        if: always()
        run: pkill -f "uvicorn app.main:app" || true
      - name: Upload JUnit + server log (never the credential manifest)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-collection-results-${{ github.sha }}
          path: |
            tests/postman/newman-results.xml
            api-server.log
          retention-days: 30
