name: PROD Convergence - Step B (Migration)

# MANAGED MIGRATE for the AUTHORITATIVE PROD database docuaction-db-geo, which
# is already Alembic-managed (measured read-only 2026-09-08: alembic_version =
# 20260829_report_artifacts, five revisions pending). Runs the reviewed Alembic
# chain expected -> head AS the dedicated, secretless migration identity
# (federated OIDC), never as pgadmin. Manual, production-environment gated (a
# human reviewer must approve the run). The utility's managed gate fails closed
# unless alembic_version is exactly the expected revision and the measured
# roles/ownership/schema fingerprint matches. Prerequisites, done separately:
#   * MANAGED PREPARE already executed by the owner-capable identity
#     (--managed-prepare: decisions model-only columns, alembic_version owned by
#     docuaction_owner) - otherwise the utility refuses.
#   * The migration service principal is mapped as a PostgreSQL principal and is
#     a member of docuaction_owner ONLY.
# docuaction-db (same resource group) is the STALE, idle server: never target it.
# The runner has a dynamic egress IP. GitHub does NOT expose in-progress job logs
# through its API (run 34262050210 timed out at this wait on 2026-09-09 for that
# reason), so the job posts its IP as a comment on the handshake issue - readable
# during the run - and then waits (retrying the DB connection, up to 20 min)
# while an operator adds ONE temporary /32 firewall rule (Option-D). The
# workflow identity is NOT granted firewall-management authority.

on:
  workflow_dispatch:
    inputs:
      handshake_issue:
        description: 'Issue number where this job posts its runner IPv4 for the operator temporary /32'
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production            # required-reviewer gate (human approval)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary
      - name: Azure login as the dedicated migration OIDC identity (secretless)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_MIGRATION_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The migration identity holds NO subscription RBAC (DB-access-only);
          # authenticate without a subscription context - it still receives an
          # Entra token for the PostgreSQL resource, which is all it needs.
          allow-no-subscriptions: true
      - name: Report runner egress IP (operator adds a temporary /32)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_PUBLIC_IP=$IP"
          echo "::notice title=Add temporary /32::Operator: az postgres flexible-server firewall-rule create -g rg-docuaction-prod -s docuaction-db-geo -n stepB-<ts> --start-ip-address $IP --end-ip-address $IP  (remove immediately after this job)"
          gh issue comment "${{ inputs.handshake_issue }}" --repo "${{ github.repository }}"             --body "prod-migration run ${{ github.run_id }}: RUNNER_PUBLIC_IP=$IP - waiting up to 20 min for a temporary /32 on docuaction-db-geo (start = end = this address). Remove it when this run finishes."
      - name: Managed Migrate - prove identity, SET ROLE, run the reviewed chain expected -> head
        env:
          PGHOST: docuaction-db-geo.postgres.database.azure.com
          PGUSER: github-actions-docuaction-backend-prod-migration
          SECRET_KEY: prodmigrationprodmigrationprodmigrationprodmigration000000
          ALLOWED_HOSTS: '*'
        run: |
          set -euo pipefail
          TOKEN=$(az account get-access-token --resource https://ossrdbms-aad.database.windows.net --query accessToken -o tsv)
          export CONV_PGTOKEN="$TOKEN"
          python - <<'PY'
          import os, time, sys, urllib.parse as up, psycopg2
          host=os.environ["PGHOST"]; user=os.environ["PGUSER"]; tok=os.environ["CONV_PGTOKEN"]
          # Wait for the operator's temporary /32 (retry the connection up to 20 min).
          deadline=time.time()+1200; conn=None; last=""
          while time.time()<deadline:
              try:
                  conn=psycopg2.connect(host=host,dbname="postgres",user=user,password=tok,sslmode="require",connect_timeout=10)
                  break
              except Exception as e:
                  last=str(e)[:100]; print("waiting for firewall /32 ...", last); time.sleep(15)
          if not conn:
              sys.exit(f"firewall /32 not opened in time; last error: {last}")
          cur=conn.cursor()
          cur.execute("select session_user"); su=cur.fetchone()[0]; print("session_user =", su)
          assert su==user, f"session_user {su!r} != migration identity {user!r}"
          cur.execute("select rolsuper,rolcreatedb,rolcreaterole,rolbypassrls from pg_roles where rolname=%s",(user,))
          attrs=cur.fetchone(); print("attrs(super,createdb,createrole,bypassrls) =", attrs)
          assert attrs==(False,False,False,False), f"migration identity not least privilege: {attrs}"
          cur.execute("select pg_has_role(%s,'pgadmin','MEMBER')",(user,)); assert cur.fetchone()[0] is False, "must NOT be a member of pgadmin"
          cur.execute("set role docuaction_owner"); cur.execute("select current_user"); cu=cur.fetchone()[0]
          print("current_user (after SET ROLE) =", cu); assert cu=="docuaction_owner", cu
          conn.close()
          print("IDENTITY PROVEN: session_user=migration identity; current_user=docuaction_owner")
          PY
          echo "Running MANAGED MIGRATE (reviewed Alembic chain 20260829_report_artifacts -> head) as the migration identity"
          export DATABASE_URL="postgresql://${PGUSER}:${TOKEN}@${PGHOST}:5432/postgres?sslmode=require"
          python scripts/prod_legacy_convergence.py --managed-migrate --i-understand-migration-writes --expected-revision 20260829_report_artifacts --admin-role pgadmin
          echo "MANAGED MIGRATE COMPLETE (revision must be 20260903_delivery_grants; second upgrade proven no-op)"
