name: CodeQL Analysis
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'

# Least privilege for the default GITHUB_TOKEN; jobs that need more declare it themselves (AUD-20260913-06).
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read          # required by CodeQL to read workflow-run info (private repos)
      security-events: write
      contents: read
    strategy:
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3 (tag object c20e34f4, resolved 2026-09-13)
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3 (tag object c20e34f4, resolved 2026-09-13)
      - uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3 (tag object c20e34f4, resolved 2026-09-13)
