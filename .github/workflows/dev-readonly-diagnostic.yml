name: DEV Read-Only Diagnostic (governed, aggregate-only)

# Narrowly-scoped governed read-only diagnostic for Azure DEV Postgres,
# proposed to replace ad-hoc manual SSH sessions for one-off reconciliation
# questions (first use case: the "1,298 Failed indicator" checkpoint,
# qa-evidence/2026-10-01-reporting-architecture/CHECKPOINT-1298-FAILED-INDICATOR-STATIC-ANALYSIS.md).
#
# PREPARED, NOT RUN. This workflow has never been dispatched. It is committed
# for review, on its own branch/PR, separate from any product change, so it
# can be reviewed and approved purely on its own governance merits -- never
# bundled into a product PR's approval.
#
# Self-review checklist (every bullet the task required, with where it is met):
#   - workflow_dispatch only, no other trigger .......... `on:` block below (only key)
#   - protected development environment approval ........ `environment: development` on the
#     job (same required-reviewer gate migration-preflight.yml uses); a run cannot start
#     without that approval, and the OIDC token itself is void without it (see the
#     "OIDC SUBJECT SCOPING" note below)
#   - least-privilege permissions ........................ workflow-level `permissions:` is
#     `contents: read` only; `id-token: write` + `issues: write` are granted on the
#     `diagnostic` job ONLY, nowhere at workflow scope -- no job in this file can write
#     code, open a PR, or touch anything but this one handshake issue comment
#   - existing OIDC identity + temporary /32 handshake,
#     no new auth mechanism ............................. steps "Login to Azure (OIDC...)",
#                                                           "Report runner IPv4 and wait...",
#                                                           "Refresh Azure OIDC login..." --
#                                                           copied verbatim in shape from
#                                                           migration-preflight.yml:112-156
#   - OIDC subject constrained to repository + environment: ALREADY TRUE, inherited for free --
#     `vars.AZURE_CLIENT_ID`'s federated credential subject is `repo:<org>/<repo>:environment:
#     development` (migration-preflight.yml:86-88's own comment: "A job that does not declare
#     it gets a token Azure refuses"), and this workflow declares the identical
#     `environment: development`, so Azure validates the same repo+environment subject before
#     issuing a token here.
#     CONSTRAINED TO THIS WORKFLOW SPECIFICALLY: NOT YET TRUE, and not achievable by editing
#     this YAML file alone. GitHub's OIDC token subject (`sub` claim) is one pattern per
#     federated credential; this App Registration's credential is subject-matched on
#     `environment:development`, which every workflow in this repo that declares that
#     environment can satisfy (migration-preflight.yml included) -- there is no second,
#     narrower federated credential scoped to `job_workflow_ref` for this workflow alone.
#     Adding one is an Azure AD App Registration change (a new federated credential with
#     subject `repo:<org>/<repo>:job_workflow_ref:<org>/<repo>/.github/workflows/
#     dev-readonly-diagnostic.yml@refs/heads/main`), which is infrastructure the operator
#     controls, not something this PR can do by itself -- flagged here as a recommended
#     follow-up, not silently claimed as already done.
#   - workflow identity is NOT granted firewall-management
#     authority (operator adds/removes the /32 out of band,
#     same as every other DB-touching workflow here) ..... no firewall-rule create/delete
#     call anywhere in this file; comment under `permissions:` below
#   - explicit READ ONLY transaction .................... ap007_1298_reconciliation.py:
#     `cur.execute("BEGIN TRANSACTION READ ONLY")`
#   - 20-second statement_timeout ........................ ap007_1298_reconciliation.py:
#     `STATEMENT_TIMEOUT_MS = 20000`, `SET LOCAL statement_timeout`
#   - aggregate counts only, wired to the existing script  step "Run the read-only
#     aggregate diagnostic" below invokes
#     scripts/dev_readonly_diagnostics/ap007_1298_reconciliation.py unchanged
#   - no migration, no deployment, no DDL, no PII ........ no `alembic`, no `deploy`, no
#     CREATE/ALTER/DROP anywhere in this file or the script it calls; the script selects
#     and prints COUNTs only (see its own docstring) -- no NPI, name or payload
#   - never prints credentials ........................... PGTOKEN is read into a step-local
#     env var and never echoed, written to $GITHUB_OUTPUT, or logged (same pattern as
#     migration-preflight.yml:160-168 and gov_integrity_snapshot.py's own docstring)
#   - removes the temporary firewall rule in a cleanup
#     step that always runs ............................. N/A BY DESIGN: this identity never
#     creates the rule, so it cannot and does not remove it either -- removal is the
#     operator's own out-of-band action on the SAME handshake issue, exactly as
#     migration-preflight.yml and prod-migration.yml already document in their header
#     comments ("The workflow identity is NOT granted firewall-management authority").
#     A cleanup step that attempted removal would imply (falsely) that this identity can
#     create or own the rule.
#
# WHAT THIS FILE CANNOT PROVE (operator verification required, not satisfied by review
# of this YAML alone):
#   - That `vars.AZURE_CLIENT_ID`'s live Azure AD App Registration actually has only the
#     IAM role assignments this diagnostic needs on docuaction-db-dev, and nothing broader
#     left over from another workflow's use of the same identity.
#   - That the federated credential's subject match is enforced the way the comment above
#     describes -- this file can declare `environment: development` and reason about what
#     *should* follow, but cannot read back Azure AD's actual federated-credential config.
#   - That the GitHub Environment named `development` actually has a required-reviewer
#     rule configured in this repository's live settings. A missing or misconfigured
#     environment protection rule would let this workflow run unapproved despite
#     `environment: development` being present in the YAML -- the YAML cannot detect that.
#   - That `docuaction_owner`'s actual GRANTed privileges on Azure DEV Postgres match what
#     is assumed above (see DB_INTEGRITY_ROLE comment below) -- this file states what the
#     role is used for, not what Postgres enforces.
# All four require checking the live Azure/GitHub configuration directly before relying on
# this workflow's safety; none of them can be settled by reading or testing this file.
#
# Hardening pass (2026-10-02, audit-and-fix session) -- three narrow commits,
# each locally tested with harmless synthetic values before commit, nothing
# dispatched:
#   1. external actions pinned to verified full commit SHAs, each with a
#      readable version comment, resolved via the GitHub API (not guessed):
#      actions/checkout@11d5960... (v4.4.0), actions/setup-python@a26af69...
#      (v5.6.0), azure/login@7184910... (v2.3.1, the v2 annotated tag
#      dereferenced to its target commit). Same releases as before
#      (@v4/@v5/@v2); nothing upgraded or downgraded.
#   2. `${{ inputs.reason }}` / `${{ inputs.handshake_issue }}` no longer
#      interpolated directly into a `run:` script (a script-injection
#      surface -- the expression substitutes into the shell source before
#      the shell runs it). Both now flow through `env:` and are read as
#      quoted shell variables, so the shell only ever sees them as data.
#   3. `handshake_issue` is validated as a positive integer in its own step,
#      before the Azure login or the `gh issue comment` call that uses it.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this diagnostic is being run (free text, required; posted on the handshake issue for the record)'
        required: true
        type: string
      handshake_issue:
        description: 'Issue NUMBER (positive integer only) where this job posts its runner IPv4 for the operator temporary /32'
        required: true
        type: string

permissions:
  contents: read
  # id-token + issues granted on the job below only, same minimal shape as
  # migration-preflight.yml and prod-migration.yml. This workflow is never
  # granted any permission that could create, modify or delete an Azure
  # firewall rule -- the operator's out-of-band /32 add/remove is the only
  # mechanism that ever touches DEV Postgres's firewall.

env:
  PGHOST: docuaction-db-dev.postgres.database.azure.com
  PGDATABASE: postgres
  PG_PRINCIPAL: github-actions-docuaction-backend-dev
  # NOT a least-privilege read-only role. `docuaction_owner` is the full
  # table-owning role this dedicated identity can assume without a new
  # grant (same reasoning as DB_INTEGRITY_ROLE in migration-preflight.yml /
  # gov_integrity_snapshot.py) -- it is a convenience choice, not a security
  # minimization. Read-only behavior here comes entirely from what THIS
  # SCRIPT chooses to execute (SELECT only, inside `BEGIN TRANSACTION READ
  # ONLY`) -- not from any privilege the database has withheld from the
  # role. A future bug in the script, or a different script run with this
  # same role, could write. A dedicated role with write privileges actually
  # revoked (e.g. `GRANT SELECT` only, no `INSERT`/`UPDATE`/`DELETE`) is
  # recommended follow-up infrastructure work, tracked separately -- not
  # something this workflow file can create or claim for itself.

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    environment: development   # required-reviewer gate, same as migration-preflight.yml
    permissions:
      id-token: write
      contents: read
      issues: write   # to post the runner IPv4 handshake comment, nothing else
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the one read-only driver this script needs
        run: python -m pip install --quiet psycopg2-binary

      # Validate BEFORE anything downstream uses this input: handshake_issue
      # names a GitHub issue number, nothing else. A non-numeric, zero or
      # negative value is refused here rather than reaching the Azure login
      # or the `gh issue comment` call further down as an unvalidated string.
      - name: Validate handshake_issue is a positive integer
        env:
          HANDSHAKE_ISSUE: ${{ inputs.handshake_issue }}
        run: |
          case "$HANDSHAKE_ISSUE" in
            ''|*[!0-9]*)
              echo "::error::handshake_issue must be a positive integer issue number; got '$HANDSHAKE_ISSUE'"
              exit 1
              ;;
          esac
          if [ "$HANDSHAKE_ISSUE" -le 0 ]; then
            echo "::error::handshake_issue must be a positive integer issue number; got '$HANDSHAKE_ISSUE'"
            exit 1
          fi

      - name: Login to Azure (OIDC - no stored client secret)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # `reason` and `handshake_issue` are workflow_dispatch inputs -- arbitrary
      # operator-supplied text. Interpolating `${{ inputs.* }}` directly into a
      # `run:` script (the previous shape) is a script-injection surface: the
      # expression is substituted into the shell source BEFORE the shell ever
      # runs, so a value containing shell metacharacters (backticks, `$(...)`,
      # quotes) would be executed, not treated as data. Both now flow through
      # `env:` and every expansion below is double-quoted, so the shell only
      # ever sees them as the CONTENTS of a variable, never as script text.
      - name: Report runner IPv4 and wait for the operator's temporary /32 (bounded)
        env:
          GH_TOKEN: ${{ github.token }}
          HANDSHAKE_ISSUE: ${{ inputs.handshake_issue }}
          RUN_REASON: ${{ inputs.reason }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          IP=$(curl -s https://api.ipify.org)
          echo "runner public IPv4: $IP"
          gh issue comment "$HANDSHAKE_ISSUE" --repo "$REPO" \
            --body "dev-readonly-diagnostic run $RUN_ID (\"$RUN_REASON\"): runner public IPv4 **$IP** - waiting up to 20 min for a temporary /32 (start = end = this address). Remove it when this run finishes. This identity cannot add or remove it itself."
          for i in $(seq 1 80); do
            if python -c "import socket;s=socket.socket();s.settimeout(5);s.connect(('$PGHOST',5432))" 2>/dev/null; then
              echo "DEV Postgres reachable after $i attempt(s)"; exit 0
            fi
            sleep 15
          done
          echo "::error::DEV Postgres not reachable within 20 minutes - no /32 was authorised. Failing closed; nothing was read."
          exit 1

      # Same reasoning as migration-preflight.yml:140-156: the first login's
      # federated client assertion is ~5 minutes old by the time the bounded
      # wait above finishes. Re-authenticating mints a fresh one immediately
      # before it is needed -- same OIDC identity, same login action, no new
      # credential or scope.
      - name: Refresh Azure OIDC login after the bounded firewall wait
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run the read-only aggregate diagnostic
        run: |
          # The token is minted here, stays a shell variable for the life of
          # this step, and is never echoed, exported to GITHUB_ENV, written to
          # an artifact, or stored as a secret. It expires on its own in
          # minutes. Same pattern as migration-preflight.yml:164-168.
          PGTOKEN=$(az account get-access-token \
            --resource https://ossrdbms-aad.database.windows.net \
            --query accessToken -o tsv)
          test -n "$PGTOKEN" || { echo "FAIL: no PostgreSQL access token"; exit 1; }
          echo "token acquired (${#PGTOKEN} chars, not printed)"
          PGTOKEN="$PGTOKEN" python scripts/dev_readonly_diagnostics/ap007_1298_reconciliation.py
