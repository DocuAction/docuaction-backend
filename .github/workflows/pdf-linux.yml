# Linux PDF rendering verification.
#
# WHY THIS EXISTS
# ---------------
# The report engine renders every PDF deliverable through WeasyPrint, which is a
# binding to the Pango/Cairo/GObject stack rather than a pure-Python library. On
# the Windows development host those libraries are absent, so the PDF tests skip
# and the path is never exercised.
#
# Phase 7.5 found that the container image could not render a PDF either — the
# Dockerfile installed only ffmpeg — while the code told every reader those
# libraries "are present in the project's Linux container image". Both are fixed;
# this workflow is what proves it on an actual Linux machine rather than by
# reading the Dockerfile.
#
# The runner installs the same packages the Dockerfile does, deliberately: if
# the two lists drift, this job fails and the image is the thing to fix.
#
# DEVELOPMENT / TEST. Renders nothing from Government data; the suite runs
# against fixtures with no database.

name: Linux PDF Rendering

on:
  push:
    branches: [main, 'fix/**']
    paths:
      - 'app/reports/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/pdf-linux.yml'
      - 'tests/test_record_review_*'
      - 'tests/record_review_pdf_support.py'
  pull_request:
    branches: [main, 'feat/reporting-architecture-2026-10-01', 'feat/treatment-b4-rule-and-full-population-2026-11-06', 'feat/mandatory-source-parity-assessment-date-2026-11-11']
  workflow_dispatch:

# Least-privilege default; no job in this workflow writes to the repo or
# creates releases/comments. Added 2026-10-18 (zizmor excessive-permissions
# survey, doc 61/65) -- no prior permissions declaration existed here at all.
permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # Mirrors the Dockerfile. Keep the two in step.
      - name: Install WeasyPrint native stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libcairo2 \
            libgdk-pixbuf-2.0-0 \
            libffi8 \
            shared-mime-info \
            fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Report engine availability
        run: |
          python - <<'PY'
          from app.reports.engine.pdf_engine import engine_info, pdf_available
          info = engine_info()
          print("available:", info["available"])
          print("version:  ", info["version"])
          print("variant:  ", info["pdf_variant_requested"])
          print("reason:   ", info.get("reason"))
          # Fail loudly. A green job with an unavailable engine proves nothing.
          assert pdf_available(), info.get("reason")
          PY

      - name: Render a PDF and check its structure
        run: |
          python - <<'PY'
          from app.reports.engine.pdf_engine import render_pdf

          # Exercises the shapes a real deliverable contains: a table with
          # header semantics, a long unbroken reference, Unicode, and the
          # development watermark.
          html = """
          <html lang="en"><head><meta charset="utf-8"><title>CI render</title>
          <style>@page { size: letter; @top-center { content: "DEVELOPMENT / TEST DATA"; } }</style>
          </head><body>
            <div class="dev-banner"><p>DEVELOPMENT / TEST DATA &mdash;
              NOT FOR GOVERNMENT DELIVERY</p><p>NOT ONC FINDINGS.</p></div>
            <h1>Rendering check</h1>
            <h2>Table semantics</h2>
            <table><caption>Discrepancy categories</caption>
              <thead><tr><th scope="col">Category</th><th scope="col">Count</th></tr></thead>
              <tbody>
                <tr><th scope="row">No discrepancies identified</th><td>0</td></tr>
                <tr><th scope="row">Minor or administrative discrepancies</th><td>0</td></tr>
                <tr><th scope="row">Inexplicable discrepancies</th><td>0</td></tr>
                <tr><th scope="row">Non-compliant discrepancies</th><td>0</td></tr>
              </tbody></table>
            <h2>Long values</h2>
            <p>A deliberately long entity name that has to wrap rather than
               overflow the page box: SOUTHEASTERN REGIONAL ORTHOPAEDIC AND
               NEUROSURGICAL SPECIALISTS OF THE GREATER METROPOLITAN AREA LLP</p>
            <p>https://npiregistry.cms.hhs.gov/api/?number=1234567890&amp;enumeration_type=NPI-2&amp;version=2.1</p>
            <h2>Unicode</h2>
            <p>Ünïcödé — em dash, curly quotes “like these”, accented Ángel, ½ ¾ §</p>
            <div style="break-before: page"></div>
            <h2>Evidence appendix</h2>
            <p>Source SHA-256: 689472073480b1cc4faf604527eda47e4e59928f7a6128d84b2f28bb6e9e9e8d</p>
          </body></html>
          """
          pdf = render_pdf(html, title="CI render")
          assert pdf[:5] == b"%PDF-", "output is not a PDF"
          assert len(pdf) > 2000, f"suspiciously small PDF: {len(pdf)} bytes"

          # Pagination, asserted against the renderer's own page list instead
          # of a byte scan for "/Type /Page". WeasyPrint compresses by default
          # and, from PDF 1.5, page dictionaries live inside a zlib-compressed
          # object stream - so those bytes are not in the file to be counted.
          # This assertion failed on every run for that reason, not because
          # pagination was broken.
          from weasyprint import HTML

          assert len(HTML(string=html).render().pages) >= 1, "no pages rendered"

          # The structure markers are inside that same compressed stream.
          # pdf_structure_report inflates before it looks, and using it here
          # keeps ONE detector in the project rather than a second copy in CI
          # that drifts away from it - which is precisely what happened.
          from app.reports.engine.accessibility import pdf_structure_report

          report = pdf_structure_report(pdf)
          tagged = report["structurally_tagged"]
          print(f"rendered {len(pdf)} bytes; markers: {report['markers']}")
          print(f"tagged structure present: {tagged}")
          if not tagged:
              print("::warning::No tagged structure tree found. PDF/UA was "
                    "requested; the renderer did not emit tags.")
          PY

      - name: Run the PDF-gated tests
        run: |
          # requirements.txt carries the runtime only, so this step exited 127
          # with "pytest: command not found" - and had done since it was
          # written. Nobody saw it because the render step above always failed
          # first, so the job never reached this line. pytest-asyncio is
          # required by asyncio_mode=auto in pytest.ini; the set matches what
          # deploy-backend.yml installs, so the two jobs run the same way.
          pip install pytest pytest-asyncio httpx
          python -m pytest tests/test_phase75_cutover.py tests/test_reports.py -q

      - name: Delivery report layout (rendered by WeasyPrint on Linux)
        env:
          LAYOUT_OUT_DIR: layout-out
        run: |
          # Renders the real delivery_processing template for five scenarios and asserts per-page layout
          # (no overlapping words, no near-blank page, no stranded headings, one-page cover, no raw booleans).
          python -m pytest tests/test_delivery_report_layout_2026_10_07.py -q -rs

      - name: Upload the rendered layout-check PDFs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: delivery-report-layout-pdfs
          path: layout-out/*.pdf
          if-no-files-found: warn
          retention-days: 7

      - name: Accessibility note
        run: |
          echo "::notice::A tagged structure tree is a precondition for an"\
               "accessible PDF, not proof of one. No Section 508 conformance is"\
               "claimed from this job. Manual 508 review and per-deliverable HHS"\
               "checklists remain outstanding (D9)."

  # 2026-11-13: the record-review export (Excel / CSV / PDF), rendered and
  # downloaded for real.
  #
  # Runs in the Dockerfile's own base image (python:3.12-slim) with the
  # Dockerfile's own apt list and the pinned requirements.txt, so the PDF is
  # paginated by the WeasyPrint/Pango/fonts the deployed container has - a
  # hosted runner carries extra fonts the image does not. ffmpeg is the one
  # Dockerfile package left out: it takes no part in rendering.
  #
  # RECORD_REVIEW_REQUIRE_REAL_RENDER=1 turns "WeasyPrint is not available"
  # from a skip into a failure, and the skip guard fails the job on any other
  # skip: green here means the real-render tests RAN. The rendered PDFs are
  # uploaded even when a test fails, so a layout failure can be looked at.
  #
  # Synthetic data only. The PostgreSQL service is disposable (never DEV, never
  # PROD); the database-backed tests roll back everything they write.
  record-review-export:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolationtest
          POSTGRES_DB: postgres
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SECRET_KEY: isolationtestisolationtestisolationtestisolationtestisolationtest
      ALLOWED_HOSTS: '*'
      DATABASE_URL: postgresql+asyncpg://postgres:isolationtest@postgres:5432/test
      DB_MIGRATION_ROLE: docuaction_owner
      DB_APP_ROLE: docuaction_app
      RECORD_REVIEW_REQUIRE_REAL_RENDER: '1'
      RECORD_REVIEW_PDF_OUT: record-review-out
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Mirrors the Dockerfile (minus ffmpeg). Keep the two in step.
      - name: Install WeasyPrint native stack (the Dockerfile's list)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libcairo2 \
            libgdk-pixbuf-2.0-0 \
            libffi8 \
            shared-mime-info \
            fonts-dejavu-core

      - name: Install Python dependencies (pinned)
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Record the rendering environment
        run: |
          mkdir -p record-review-out
          {
            echo "commit: ${GITHUB_SHA}"
            echo "image: python:3.12-slim"; cat /etc/os-release | grep PRETTY_NAME
            python --version
            pip freeze | grep -i -E '^(weasyprint|pydyf|tinycss2|cssselect2|fonttools|pyphen|tinyhtml5|pypdf|pikepdf|pdfplumber|pdfminer|openpyxl)'
            dpkg-query -W libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libharfbuzz0b libfontconfig1 fonts-dejavu-core
          } | tee record-review-out/environment.txt
          python -c "from app.reports.engine.pdf_engine import engine_info, pdf_available; i = engine_info(); print(i); assert pdf_available(), i.get('reason')"

      - name: Create the disposable database and roles (owner / app split, UTC)
        run: |
          python - <<'PY'
          import asyncio, asyncpg
          BASE = "postgresql://postgres:isolationtest@postgres:5432/"
          async def run(db, statements):
              conn = await asyncpg.connect(BASE + db)
              try:
                  for statement in statements:
                      await conn.execute(statement)
              finally:
                  await conn.close()
          asyncio.run(run("postgres", [
              "CREATE ROLE docuaction_owner LOGIN PASSWORD 'x'",
              "CREATE ROLE docuaction_app LOGIN PASSWORD 'x'",
              "CREATE DATABASE test OWNER docuaction_owner",
              "ALTER DATABASE test SET timezone = 'UTC'"]))
          asyncio.run(run("test", [
              "ALTER SCHEMA public OWNER TO docuaction_owner",
              "GRANT ALL ON SCHEMA public TO docuaction_owner",
              "GRANT USAGE, CREATE ON SCHEMA public TO docuaction_app"]))
          PY

      - name: Migrate to head (Alembic)
        run: python -m alembic upgrade head

      - name: Record-review render, preservation and download-path tests
        run: |
          python -m pytest \
            tests/test_record_review_pdf_render_2026_11_13.py \
            tests/test_record_review_download_path_db_2026_11_13.py \
            tests/test_record_review_pdf_html_2026_11_13.py \
            tests/test_october_review_export_db_2026_11_12.py \
            tests/test_october_review_dataset_2026_11_11.py \
            -v --tb=short -rs --junitxml=record-review-results.xml

      - name: Fail if any test was skipped
        if: always()
        run: python scripts/ci_skip_guard.py record-review-results.xml

      - name: Upload the rendered PDFs, engine facts and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: record-review-export-${{ github.sha }}
          path: |
            record-review-out/
            record-review-results.xml
          if-no-files-found: warn
          retention-days: 14
