# Dynamic Application Security Testing (DAST) — OWASP ZAP
# =========================================================
# ZAP is an open-source scanner widely used in federal secure development
# workflows. This job covers the UNAUTHENTICATED attack surface; the
# authenticated surface is covered by stackhawk-scan.yml. Neither replaces the
# other — an unauthenticated crawler cannot reach a role-guarded endpoint, and
# an authenticated scan starts past the very boundary an attacker hits first.
#
# DEV ONLY. Production is never a scan target: an active scan submits hostile
# input to every discovered endpoint, and against production that is
# indistinguishable from an attack on live records.
#
# ZAP findings are NOT defects until reproduced. Follow the finding workflow in
# docs/DEPLOYMENT_GUIDE.md: detect -> reproduce manually -> confirm
# exploitability -> fix only if confirmed -> re-test. Do not auto-fix.

name: OWASP ZAP DAST Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

permissions:
  contents: read
  issues: write           # zap actions open an issue summarising findings

jobs:
  zap-api-scan:
    name: ZAP API scan (unauthenticated)
    runs-on: ubuntu-latest
    env:
      TARGET: https://docuaction-dev.azurewebsites.net

    steps:
      - uses: actions/checkout@v4

      - name: Refuse to run against production
        run: |
          case "$TARGET" in
            *api.docuaction.io*|*api-prod.docuaction.io*|*docuaction-emffhfgwc0gffgc9*)
              echo "::error::TARGET points at production. DAST is dev-only."
              exit 1 ;;
          esac
          echo "Target confirmed non-production: $TARGET"

      - name: Wait for dev to be reachable
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$TARGET/health" || true)
            echo "attempt $i: /health $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::dev did not become healthy; not scanning a cold target"
          exit 1

      - name: Fetch OpenAPI spec (original, preserved)
        run: |
          curl -sf --max-time 60 "$TARGET/openapi.json" -o openapi.original.json
          python -c "import json;s=json.load(open('openapi.original.json'));print('paths:',len(s['paths']))"

      # ZAP cannot resolve the app's relative server URL ("/") when it scans a
      # local file and then imports 0 URLs (run 38265533318). Give the SCAN-LOCAL
      # copy one explicit, allowlisted DEV server (root, path and operation
      # overrides checked). The original above is never modified. Production
      # origins and non-allowlisted overrides fail the job.
      - name: Prepare scan-local spec (explicit allowlisted DEV server)
        run: |
          python scripts/zap_prepare_spec.py \
            --input openapi.original.json --output openapi.scan.json \
            --server-url "$TARGET" --report zap_spec_prepare_report.json

      - name: Run ZAP API scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: openapi.scan.json
          format: openapi
          # Do not fail the build on findings. A DAST report is evidence to be
          # triaged, not a merge gate - gating on raw findings trains people to
          # silence the scanner rather than read it. This does NOT cover setup
          # failures: a spec that imports 0 URLs makes the scan exit non-zero
          # and the job fails, as it must.
          allow_issue_writing: true
          fail_action: false
          cmd_options: '-d -z "-config scanner.strength=MEDIUM" -I'

      # Belt and braces: a scan that produced no report, or a report with no
      # scanned site, did not obtain coverage and must not look like a pass.
      - name: Assert ZAP scanned the target (coverage obtained)
        run: |
          python - <<'PY'
          import json, sys
          try:
              rep = json.load(open("report_json.json"))
          except Exception as exc:
              print(f"::error::no usable ZAP report ({exc}); security coverage not obtained")
              sys.exit(1)
          sites = [s.get("@name") for s in rep.get("site", [])]
          print("sites scanned:", sites)
          if not sites:
              print("::error::ZAP report lists no scanned site; security coverage not obtained")
              sys.exit(1)
          PY

      - name: Record DAST setup failure (not a security pass)
        if: failure()
        run: |
          {
            echo "### DAST setup failed - security coverage NOT obtained"
            echo
            echo "This run did not complete a scan of the API surface. It is **not** a security pass"
            echo "and it is **not** an application finding. See the uploaded diagnostics"
            echo "(zap.out, spec preparation report, original and scan-local specs)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ZAP report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-${{ github.run_number }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            report_html.html
            report_json.json
            report_md.md
            zap.out
            zap_spec_prepare_report.json
            openapi.original.json
            openapi.scan.json
