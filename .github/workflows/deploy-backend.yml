name: Deploy Backend

# Tag pushes BUILD ONLY. Both deploy jobs are gated on
# github.event.inputs.environment, which is empty for a push event, so a tag push
# produces a verified, retained artifact and stops there. Deploying is always a
# deliberate workflow_dispatch. Do not "fix" this by loosening the conditions
# unless you actually want a tag push to reach production unattended.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to'
        required: true
        type: choice
        options:
          - dev
          - production
      image_tag:
        description: 'Container image tag to deploy (the commit SHA, e.g. 62a9273). Resolved to an immutable digest before anything changes.'
        required: true
        type: string
      run_migrations:
        description: 'Run approved Alembic migrations as the schema owner before the image change'
        required: true
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

  push:
    tags:
      - 'v*'
      - 'sprint*'
      - 'platform*'

env:
  DEV_APP: docuaction-dev
  DEV_RG: rg-docuaction-dev
  PROD_APP: Docuaction
  PROD_RG: rg-docuaction-prod
  DEV_REGISTRY: acrdocuactiondev
  DEV_LOGIN_SERVER: acrdocuactiondev.azurecr.io
  PROD_REGISTRY: acrdocuactionprod
  PROD_LOGIN_SERVER: acrdocuactionprod.azurecr.io
  IMAGE_REPO: docuaction-backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.image_tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pip install pytest pytest-asyncio httpx
          python -m pytest tests/ -v --tb=short --junitxml=test-results.xml
          echo "Tests completed"
        env:
          # No database in CI. tests/conftest.py probes for one and skips the
          # DB-backed tests with an explicit reason rather than failing the run.
          # The boundary tests - routing, auth, authorization, headers - all run.
          SECRET_KEY: ${{ github.sha }}${{ github.sha }}
          ALLOWED_HOSTS: '*'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: test-results.xml
          retention-days: 30

      - name: Run security scan (Bandit)
        run: |
          pip install bandit
          bandit -r app/ -f json -o bandit-results.json || true
          echo "Bandit scan completed"

      - name: Run dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format json --output pip-audit-results.json || true
          echo "Dependency audit completed"

      - name: Run security gate
        run: |
          # Advisory only. data/findings.db is gitignored, so a fresh runner has no
          # prior scan to gate on and this reports an empty corpus. The gate with
          # real teeth is security-nightly.yml, which scans first, then gates.
          if [ -f security-platform/cli.py ]; then
            cd security-platform
            pip install -r requirements.txt 2>/dev/null || true
            python cli.py gate || echo "Gate evaluated"
          else
            echo "Security platform not found - skipping gate"
          fi

      - name: Build pydeps (production artifact)
        run: |
          mkdir -p pydeps
          # langdetect is excluded here and installed below. It publishes NO
          # wheel in ANY version - sdist only - so --only-binary=:all: cannot
          # satisfy it and fails the step outright:
          #   ERROR: Could not find a version that satisfies the requirement
          #          langdetect==1.0.9 (from versions: none)
          # Broken since langdetect was added on 2026-08-09; unseen because
          # "Run tests" failed earlier in the job on every run since.
          grep -v '^langdetect' requirements.txt > /tmp/requirements-wheels.txt
          pip install -r /tmp/requirements-wheels.txt \
            --target pydeps \
            --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --python-version 3.12 \
            --implementation cp \
            --abi cp312
          # Pure Python: no ABI to match, so the platform constraints are
          # meaningless for it, and the runner IS the target platform
          # (ubuntu-latest, x86_64, CPython 3.12) - building the sdist here
          # produces exactly what the target needs.
          #
          # Deliberately the ONLY package installed this way, and named
          # explicitly rather than by a fallback that retries failures without
          # constraints: such a fallback would silently admit a native package
          # built for the wrong platform. Dry-run resolution confirms langdetect
          # is the only requirement that wheel-only cannot satisfy.
          pip install langdetect==1.0.9 --target pydeps
          pip install gunicorn==22.0.0 \
            --target pydeps \
            --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --python-version 3.12 \
            --implementation cp \
            --abi cp312

      - name: Verify artifact
        run: |
          echo "=== Artifact verification ==="
          # No .env files
          ENV_COUNT=$(find . -name ".env" -not -path "./pydeps/*" | wc -l)
          echo ".env files: $ENV_COUNT"
          if [ "$ENV_COUNT" -gt 0 ]; then
            echo "ERROR: .env file found in artifact!"
            exit 1
          fi
          # gunicorn present - prod's startup command is `python -m gunicorn ...`,
          # which resolves out of pydeps via PYTHONPATH. Missing here = 503 on deploy.
          ls pydeps/gunicorn || { echo "ERROR: gunicorn missing from pydeps"; exit 1; }
          # No duplicate dist-info
          DUPES=$(ls -d pydeps/*.dist-info 2>/dev/null | sed 's/-[0-9].*//' | sort | uniq -d | wc -l)
          echo "Duplicate dist-info packages: $DUPES"
          if [ "$DUPES" -gt 0 ]; then
            echo "WARNING: Duplicate dist-info found"
          fi
          echo "=== Verification passed ==="

      # NOTE: this ZIP is a RELEASE ARCHIVE and CI EVIDENCE - a verifiable
      # record of the exact source and resolved dependency set behind a
      # release. It is NOT the App Service deployment unit: these are custom
      # container apps and the deployable unit is an OCI image digest. Do not
      # deploy this ZIP to them.
      - name: Build deployment zip
        run: |
          zip -r deploy.zip \
            app/ alembic/ alembic.ini requirements.txt pydeps/ \
            -x "**/__pycache__/*" "**/*.pyc" "**/.env"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-deploy-${{ github.sha }}
          path: deploy.zip
          retention-days: 30

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.sha }}
          path: |
            bandit-results.json
            pip-audit-results.json
          retention-days: 90

  # ───────────────────────────────────────────────────────────────────────────
  # DEPLOYMENT
  #
  # These apps are CUSTOM CONTAINER App Services. The deployable unit is an OCI
  # image identified by an immutable DIGEST, never a ZIP and never a tag alone.
  #
  # The previous implementation ran `az webapp deploy --type zip`. That could
  # not work here: the Dockerfile runs gunicorn from /app inside the image, and
  # DEV has WEBSITES_ENABLE_APP_SERVICE_STORAGE=false, so the ZIP landed
  # somewhere the running container cannot see. The deployment reported success
  # while the app kept running the OLD image - a silent no-op recorded as a
  # successful release. It has been replaced, not patched.
  #
  # A digest rather than a tag because a tag can be moved. The thing validated
  # in DEV and the thing promoted to PROD must be provably the same bytes.
  # ───────────────────────────────────────────────────────────────────────────

  deploy-dev:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: development
    if: github.event.inputs.environment == 'dev' || github.event.inputs.environment == 'production'
    permissions:
      # azure/login mints a short-lived GitHub OIDC token and exchanges it for
      # an Azure token. No client secret is stored anywhere in this repository.
      id-token: write
      contents: read
    outputs:
      previous_image: ${{ steps.capture.outputs.previous_image }}
      deployed_digest: ${{ steps.resolve.outputs.digest }}
    steps:
      # This job RUNS ALEMBIC. Without a checkout there is no alembic.ini and no
      # alembic/versions, and `alembic current` fails with "No config file
      # found" - which the capture step swallowed into an `|| echo`, so the
      # deployment would have continued having recorded no starting revision at
      # all. The migration step would then have failed AFTER the rollback point
      # was captured but BEFORE the image changed.
      - name: Checkout the release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.image_tag }}

      # `python` is not guaranteed to resolve on the runner image; `python3` is.
      # Pinned to the version the release was built and verified against.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Login to Azure (OIDC - no stored client secret)
        uses: azure/login@v2
        with:
          # Identifiers, not credentials. See container-release.yml for why
          # these are environment variables rather than secrets.
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the candidate image exists in the DEV registry
        id: resolve
        run: |
          # Fail before touching anything if the image is not there. Resolving
          # the digest here also pins what follows: every later step uses this
          # value, not the tag, so a tag moved mid-deploy cannot change what
          # ships.
          DIGEST=$(az acr manifest show-metadata "${DEV_LOGIN_SERVER}/${IMAGE_REPO}:${{ github.event.inputs.image_tag }}" --query digest -o tsv)
          test -n "$DIGEST" || { echo "candidate image not found in ${DEV_REGISTRY}"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "candidate: ${IMAGE_REPO}:${{ github.event.inputs.image_tag }} -> $DIGEST"

      - name: Capture the rollback point BEFORE any change
        id: capture
        run: |
          # Captured first, and by digest, so incident response never has to
          # rebuild from source or trust that a tag still means what it meant.
          PREV=$(az webapp config show -n "$DEV_APP" -g "$DEV_RG" --query linuxFxVersion -o tsv)
          echo "previous_image=$PREV" >> "$GITHUB_OUTPUT"
          echo "ROLLBACK POINT: $PREV"
          {
            echo "## Rollback point"
            echo ""
            echo "    $PREV"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture the current Alembic revision
        # Gated on the SAME input as the migration below, because that is the
        # only thing it exists to serve: it records the revision to come back
        # to if a migration has to be undone. Ungated it made EVERY deployment
        # require PostgreSQL connectivity, including image-only ones that touch
        # no schema - and GitHub-hosted runners have no network path to the DEV
        # database (its firewall lists App Service outbound addresses only).
        # So an image-only deploy failed here, before the image ever changed,
        # for a revision nobody was going to use. Migrations run out of band
        # through the authorised DBA path; this deployment ships an image.
        if: github.event.inputs.run_migrations == 'true'
        run: |
          # Recorded before migrating so the exact starting revision is known
          # if a downgrade is ever needed.
          python -m pip install --quiet alembic asyncpg sqlalchemy
          echo "current revision:"
          DATABASE_URL="${{ secrets.MIGRATION_DATABASE_URL }}" alembic current
        env:
          DB_APP_ROLE: docuaction_app

      - name: Run approved migrations as the schema owner
        if: github.event.inputs.run_migrations == 'true'
        run: |
          # Deliberately gated on its own input, and deliberately BEFORE the
          # image change: the new image expects the new schema. The owner
          # identity is used because the runtime application role has no DDL
          # rights, which is a control, not an inconvenience.
          #
          # DB_APP_ROLE is not optional. 20260830_run_lifecycle grants
          # column-level UPDATE to the RUNTIME role, and it refuses to run if
          # the role it is about to grant to already OWNS the table - because
          # an owner can already update every column, so the grant would report
          # success while enforcing nothing. This connection IS the owner, so
          # without DB_APP_ROLE the migration raises RunLifecycleTargetError and
          # the whole upgrade aborts. Naming the runtime role here is what makes
          # the grant mean something.
          DATABASE_URL="${{ secrets.MIGRATION_DATABASE_URL }}" alembic upgrade head
          DATABASE_URL="${{ secrets.MIGRATION_DATABASE_URL }}" alembic current
        env:
          DB_APP_ROLE: docuaction_app

      - name: Point DEV at the candidate image by digest
        run: |
          # THE deployment step. Note what it is NOT: there is no
          # `az webapp deploy --type zip` anywhere in this job.
          az webapp config container set --name "$DEV_APP" --resource-group "$DEV_RG" --docker-custom-image-name "${DEV_LOGIN_SERVER}/${IMAGE_REPO}@${{ steps.resolve.outputs.digest }}"
          az webapp restart --name "$DEV_APP" --resource-group "$DEV_RG"

      - name: Wait for a healthy start
        id: health
        run: |
          echo "waiting for DEV to report healthy ..."
          CODE=000
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /tmp/h.json -w '%{http_code}' "https://${DEV_APP}.azurewebsites.net/health" || true)
            if [ "$CODE" = "200" ]; then echo "healthy after $i attempt(s)"; break; fi
            sleep 15
          done
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          test "$CODE" = "200" || { echo "DEV did not become healthy (last: $CODE)"; exit 1; }

      - name: Acceptance checks
        id: acceptance
        run: |
          BASE="https://${DEV_APP}.azurewebsites.net"
          echo "--- health ---"
          curl -fsS "$BASE/health" > /dev/null && echo ok
          echo "--- an unauthenticated caller must still be refused ---"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/tefca/arc/entities")
          echo "anonymous -> $CODE"
          case "$CODE" in 401|403) echo "correctly gated";; *) echo "FAIL: expected 401/403, got $CODE"; exit 1;; esac

      - name: Roll back to the previous image if acceptance failed
        if: failure() && steps.capture.outputs.previous_image != ''
        run: |
          # The previous image, by the reference captured before the change. No
          # rebuild, no dependence on a floating tag.
          PREV="${{ steps.capture.outputs.previous_image }}"
          echo "ROLLING BACK to $PREV"
          az webapp config container set --name "$DEV_APP" --resource-group "$DEV_RG" --docker-custom-image-name "${PREV#DOCKER|}"
          az webapp restart --name "$DEV_APP" --resource-group "$DEV_RG"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://${DEV_APP}.azurewebsites.net/health" || true)
            if [ "$CODE" = "200" ]; then echo "rollback healthy"; exit 0; fi
            sleep 15
          done
          echo "ROLLBACK DID NOT REACH HEALTH - manual intervention required"
          exit 1

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: production
    # PROD requires its OWN authorisation. A dispatch selecting 'dev' can never
    # reach this job, so DEV-only authority cannot deploy production.
    if: github.event.inputs.environment == 'production'
    steps:
      # DELIBERATELY UNCHANGED. The DEV release identity is federated to the
      # `development` environment only and has no PROD scope, so wiring it in
      # here would be the one thing this job must never have: a path from DEV
      # authority to production. `secrets.AZURE_CREDENTIALS` does not exist, so
      # as written this job FAILS CLOSED at its first step. Production needs its
      # own federated identity, its own RBAC and its own authorisation, and
      # establishing those is a separate, explicitly approved piece of work.
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Import the DEV-validated digest into the PROD registry
        id: promote
        run: |
          # SAME BYTES. The digest validated in DEV is imported into the PROD
          # registry rather than rebuilt from source, so what production runs is
          # provably what DEV proved. Separate registries are why an import is
          # needed at all; the import preserves image identity.
          SRC="${DEV_LOGIN_SERVER}/${IMAGE_REPO}@${{ needs.deploy-dev.outputs.deployed_digest }}"
          az acr import --name "$PROD_REGISTRY" --source "$SRC" --image "${IMAGE_REPO}:${{ github.event.inputs.image_tag }}" --force
          PROD_DIGEST=$(az acr manifest show-metadata "${PROD_LOGIN_SERVER}/${IMAGE_REPO}:${{ github.event.inputs.image_tag }}" --query digest -o tsv)
          echo "digest=$PROD_DIGEST" >> "$GITHUB_OUTPUT"
          echo "DEV digest : ${{ needs.deploy-dev.outputs.deployed_digest }}"
          echo "PROD digest: $PROD_DIGEST"

      - name: Capture the PROD rollback point BEFORE any change
        id: capture
        run: |
          PREV=$(az webapp config show -n "$PROD_APP" -g "$PROD_RG" --query linuxFxVersion -o tsv)
          echo "previous_image=$PREV" >> "$GITHUB_OUTPUT"
          echo "PROD ROLLBACK POINT: $PREV"

      - name: Point PROD at the promoted digest
        run: |
          az webapp config container set --name "$PROD_APP" --resource-group "$PROD_RG" --docker-custom-image-name "${PROD_LOGIN_SERVER}/${IMAGE_REPO}@${{ steps.promote.outputs.digest }}"
          az webapp restart --name "$PROD_APP" --resource-group "$PROD_RG"

      - name: Wait for a healthy start
        run: |
          CODE=000
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://${PROD_APP}.azurewebsites.net/health" || true)
            if [ "$CODE" = "200" ]; then echo "healthy after $i attempt(s)"; break; fi
            sleep 15
          done
          test "$CODE" = "200" || { echo "PROD did not become healthy (last: $CODE)"; exit 1; }

      - name: Roll back PROD if the release did not come up
        if: failure() && steps.capture.outputs.previous_image != ''
        run: |
          PREV="${{ steps.capture.outputs.previous_image }}"
          echo "ROLLING BACK PROD to $PREV"
          az webapp config container set --name "$PROD_APP" --resource-group "$PROD_RG" --docker-custom-image-name "${PREV#DOCKER|}"
          az webapp restart --name "$PROD_APP" --resource-group "$PROD_RG"
