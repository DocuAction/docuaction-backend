name: Deploy Backend

# Tag pushes BUILD ONLY. Both deploy jobs are gated on
# github.event.inputs.environment, which is empty for a push event, so a tag push
# produces a verified, retained artifact and stops there. Deploying is always a
# deliberate workflow_dispatch. Do not "fix" this by loosening the conditions
# unless you actually want a tag push to reach production unattended.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to'
        required: true
        type: choice
        options:
          - dev
          - production
      tag:
        description: 'Tag or branch to deploy (e.g. sprint1.1-security-v1.0)'
        required: true
        type: string

  push:
    tags:
      - 'v*'
      - 'sprint*'
      - 'platform*'

env:
  AZURE_PROD_APP: Docuaction
  AZURE_PROD_RG: rg-docuaction-prod
  AZURE_DEV_APP: docuaction-dev
  AZURE_DEV_RG: rg-docuaction-dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest --tb=short -q || true
          echo "Tests completed"

      - name: Run security scan (Bandit)
        run: |
          pip install bandit
          bandit -r app/ -f json -o bandit-results.json || true
          echo "Bandit scan completed"

      - name: Run dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format json --output pip-audit-results.json || true
          echo "Dependency audit completed"

      - name: Run security gate
        run: |
          # Advisory only. data/findings.db is gitignored, so a fresh runner has no
          # prior scan to gate on and this reports an empty corpus. The gate with
          # real teeth is security-nightly.yml, which scans first, then gates.
          if [ -f security-platform/cli.py ]; then
            cd security-platform
            pip install -r requirements.txt 2>/dev/null || true
            python cli.py gate || echo "Gate evaluated"
          else
            echo "Security platform not found - skipping gate"
          fi

      - name: Build pydeps (production artifact)
        run: |
          mkdir -p pydeps
          pip install -r requirements.txt \
            --target pydeps \
            --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --python-version 3.12 \
            --implementation cp \
            --abi cp312
          pip install gunicorn==22.0.0 \
            --target pydeps \
            --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --python-version 3.12 \
            --implementation cp \
            --abi cp312

      - name: Verify artifact
        run: |
          echo "=== Artifact verification ==="
          # No .env files
          ENV_COUNT=$(find . -name ".env" -not -path "./pydeps/*" | wc -l)
          echo ".env files: $ENV_COUNT"
          if [ "$ENV_COUNT" -gt 0 ]; then
            echo "ERROR: .env file found in artifact!"
            exit 1
          fi
          # gunicorn present - prod's startup command is `python -m gunicorn ...`,
          # which resolves out of pydeps via PYTHONPATH. Missing here = 503 on deploy.
          ls pydeps/gunicorn || { echo "ERROR: gunicorn missing from pydeps"; exit 1; }
          # No duplicate dist-info
          DUPES=$(ls -d pydeps/*.dist-info 2>/dev/null | sed 's/-[0-9].*//' | sort | uniq -d | wc -l)
          echo "Duplicate dist-info packages: $DUPES"
          if [ "$DUPES" -gt 0 ]; then
            echo "WARNING: Duplicate dist-info found"
          fi
          echo "=== Verification passed ==="

      - name: Build deployment zip
        run: |
          zip -r deploy.zip \
            app/ alembic/ alembic.ini requirements.txt pydeps/ \
            -x "**/__pycache__/*" "**/*.pyc" "**/.env"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-deploy-${{ github.sha }}
          path: deploy.zip
          retention-days: 30

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.sha }}
          path: |
            bandit-results.json
            pip-audit-results.json
          retention-days: 90

  deploy-dev:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: development
    if: github.event.inputs.environment == 'dev' || github.event.inputs.environment == 'production'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-deploy-${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to DEV
        run: |
          # NO --clean here, deliberately. docuaction-dev is an Oryx-build app;
          # --clean wipes oryx-manifest.toml and puts it in a 503 crash loop.
          # This was learned the hard way on 2026-07-26. See
          # docs/deployment/azure-deployment-guide.md.
          az webapp deploy \
            --name ${{ env.AZURE_DEV_APP }} \
            --resource-group ${{ env.AZURE_DEV_RG }} \
            --type zip \
            --src-path deploy.zip

      - name: Smoke test DEV
        run: |
          sleep 60
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            https://docuaction-dev.azurewebsites.net/health)
          echo "DEV /health: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: DEV health check failed!"
            exit 1
          fi
          echo "DEV deployment verified"

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: production
    if: github.event.inputs.environment == 'production'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-deploy-${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Pre-deploy Key Vault check
        run: |
          echo "Checking Key Vault references..."
          SETTINGS=$(az webapp config appsettings list \
            --name ${{ env.AZURE_PROD_APP }} \
            --resource-group ${{ env.AZURE_PROD_RG }} \
            --query "[?contains(value, '@Microsoft.KeyVault')]" -o json)
          echo "KV references found: $(echo $SETTINGS | jq length)"
          echo "All references must resolve before deploy continues"

      - name: Deploy to PRODUCTION
        run: |
          # --clean IS correct here and only here. Docuaction is a pre-built-pydeps
          # app, not Oryx. Without --clean, az webapp deploy overlays rather than
          # replaces, leaving orphaned dist-info that corrupts pip-audit and SBOM
          # accuracy on every subsequent scan.
          az webapp deploy \
            --name ${{ env.AZURE_PROD_APP }} \
            --resource-group ${{ env.AZURE_PROD_RG }} \
            --type zip \
            --src-path deploy.zip \
            --clean true

      - name: Smoke test PRODUCTION
        run: |
          sleep 60
          echo "=== Production Verification ==="
          # Health
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://api-prod.docuaction.io/health)
          echo "/health: $HTTP"
          [ "$HTTP" = "200" ] || { echo "FAILED"; exit 1; }
          # Case management auth gate
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://api-prod.docuaction.io/api/v1/case-management/patients)
          echo "case-mgmt (no auth): $HTTP"
          [ "$HTTP" = "401" ] || echo "WARNING: expected 401 (FastAPI 0.140 returns 401, not 403 - see docs/deployment/BREAKING_401_vs_403.md)"
          # Bulletin
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://api-prod.docuaction.io/api/v1/bulletin/health)
          echo "bulletin: $HTTP"
          [ "$HTTP" = "200" ] || echo "WARNING: bulletin check failed"
          # TEFCA
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://api-prod.docuaction.io/api/tefca/status)
          echo "tefca: $HTTP"
          [ "$HTTP" = "200" ] || echo "WARNING: tefca check failed"
          echo "=== Verification complete ==="
