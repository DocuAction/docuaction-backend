name: Security Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/reporting-architecture-2026-10-01']
  schedule:
    - cron: '0 6 * * 1'

jobs:
  sast:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install security tools
        run: pip install bandit pip-audit cyclonedx-bom
      - name: Bandit SAST scan
        run: bandit -r app/ -f json -o bandit-report.json -ll || true
      - name: pip-audit dependency scan
        run: pip-audit -r requirements.txt -f json -o pip-audit-report.json || true
      - name: Generate SBOM (CycloneDX)
        run: cyclonedx-py requirements -i requirements.txt -o sbom-backend.json --format json || true
      - name: Upload security reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
            sbom-backend.json
