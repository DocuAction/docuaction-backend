name: Security Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  sast:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install security tools
        run: pip install bandit pip-audit cyclonedx-bom
      - name: Bandit SAST scan
        run: bandit -r app/ -f json -o bandit-report.json -ll || true
      - name: pip-audit dependency scan
        run: pip-audit -r requirements.txt -f json -o pip-audit-report.json || true
      - name: Generate SBOM (CycloneDX)
        run: cyclonedx-py requirements -i requirements.txt -o sbom-backend.json --format json || true
      - name: Upload security reports
        uses: actions/upload-artifact@v7
        with:
          name: backend-security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
            sbom-backend.json
